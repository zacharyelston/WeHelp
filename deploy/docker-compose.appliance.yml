# Always-on Back Office appliance (office Mac mini). Layered on the base file:
#   docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.appliance.yml ...
# Use `deploy/appliance.sh` (or the `make appliance-*` targets), which pass both.
# See docs/APPLIANCE.md.
services:
  db:
    restart: unless-stopped
    # Postgres is reachable only from this host, never from the office LAN.
    ports: !override
      - "127.0.0.1:5432:5432"

  server:
    restart: unless-stopped
    # Created by `appliance.sh init-env` with mode 600; holds a persistent
    # WEHELP_JWT_SECRET so sessions survive restarts.
    env_file:
      - path: .env
        required: true
    environment:
      WEHELP_ENV: appliance
      WEHELP_OFFICE_DIR: /var/lib/wehelp/office
    # Office keys, local CA and Registry registration (#35). Created by
    # `appliance.sh init-office`; see docs/OFFICE_KEYS.md.
    volumes:
      - officekeys:/var/lib/wehelp/office
    # Staff web UI over HTTPS with the office CA (#38). Set
    # WEHELP_STAFF_HOSTS in .env to the names and LAN addresses staff use,
    # e.g. barnacle.local,192.168.1.55. Plain HTTP on 8080 then only answers
    # health checks and redirects to HTTPS.
    ports: !override
      - "8080:8080"
      - "8443:8443"

volumes:
  officekeys:
