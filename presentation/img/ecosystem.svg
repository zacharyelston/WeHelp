<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760" role="img" aria-labelledby="t d">
<title id="t">The WeHelp ecosystem</title>
<desc id="d">The patient's WeHelp app pairs with the practice's Back Office by scanning a QR code at the front desk. The app then talks end to end to the Back Office through WeHelp's Relay, which forwards encrypted traffic it cannot read. The Back Office, in the practice, holds all patient data and serves staff, the front desk and providers. The Registry lists which practices exist. The Relay also serves each practice's public website and blog.</desc>
<defs>
<marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7CC3F0"/></marker>
<marker id="aw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#F4A07C"/></marker>
<marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8FA9BC"/></marker>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0E2233"/><stop offset="1" stop-color="#14344B"/></linearGradient>
</defs>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:#E8F1F7}
.eyebrow{font-size:20px;font-weight:700;letter-spacing:3px;fill:#7CC3F0}
.h1{font-size:44px;font-weight:700}
.h3{font-size:28px;font-weight:700}
.body{font-size:19px;fill:#B9CDDC}
.lbl{font-size:17px;fill:#B9CDDC}
.warm{fill:#F4A07C}
.chip{font-size:17px;font-weight:600;fill:#10283A}
.box{fill:#173E58;stroke:#2C5F80;stroke-width:2}
.hot{fill:#1B4866;stroke:#F4A07C;stroke-width:3}
</style>
<rect width="1600" height="760" rx="28" fill="url(#bg)"/>

<text class="eyebrow" x="60" y="72">THE WEHELP ECOSYSTEM</text>
<text class="h1" x="60" y="124">Patient data lives only in the practice</text>

<!-- Website and blog -->
<rect class="box" x="60" y="170" width="340" height="104" rx="18"/>
<g transform="translate(84 196)" fill="none" stroke="#7CC3F0" stroke-width="3"><rect x="0" y="0" width="52" height="40" rx="5"/><path d="M0 11 H52"/><path d="M10 22 H42 M10 30 H32"/></g>
<text class="h3" x="156" y="216">Website + blog</text>
<text class="lbl" x="156" y="246">Public pages, no patient data</text>

<!-- Registry -->
<rect class="box" x="630" y="170" width="340" height="104" rx="18"/>
<g transform="translate(654 194)" fill="none" stroke="#7CC3F0" stroke-width="3"><rect x="0" y="0" width="44" height="52" rx="5"/><path d="M10 14 H34 M10 26 H34 M10 38 H26"/></g>
<text class="h3" x="716" y="216">Registry</text>
<text class="lbl" x="716" y="246">Which practices exist</text>

<!-- Patient app -->
<rect class="box" x="60" y="320" width="340" height="190" rx="18"/>
<g transform="translate(88 350)"><rect x="0" y="0" width="64" height="120" rx="12" fill="none" stroke="#7CC3F0" stroke-width="3"/><rect x="22" y="8" width="20" height="5" rx="2.5" fill="#7CC3F0"/><rect x="10" y="26" width="44" height="10" rx="3" fill="#2C5F80"/><rect x="10" y="44" width="44" height="10" rx="3" fill="#2C5F80"/><rect x="10" y="62" width="30" height="10" rx="3" fill="#2C5F80"/></g>
<text class="h3" x="176" y="372">WeHelp app</text>
<text class="body" x="176" y="404">iPhone and iPad</text>
<text class="body" x="176" y="432">Visits, messages,</text>
<text class="body" x="176" y="458">orders, readings</text>

<!-- Relay -->
<rect class="box" x="630" y="320" width="340" height="190" rx="18"/>
<g transform="translate(656 352)" fill="none" stroke="#7CC3F0" stroke-width="3"><rect x="0" y="22" width="40" height="32" rx="5"/><path d="M8 22 V12 a12 12 0 0 1 24 0 V22"/></g>
<text class="h3" x="716" y="378">Relay</text>
<text class="body" x="656" y="438">Run by WeHelp. Forwards</text>
<text class="body" x="656" y="466">encrypted traffic it can’t read.</text>

<!-- Back Office -->
<rect class="hot" x="1200" y="170" width="340" height="340" rx="18"/>
<g transform="translate(1226 198)" fill="none" stroke="#F4A07C" stroke-width="3"><path d="M0 22 L28 0 L56 22"/><rect x="6" y="20" width="44" height="34" rx="3"/><rect x="22" y="34" width="12" height="20"/></g>
<text class="h3" x="1296" y="224">Back Office</text>
<text class="lbl warm" x="1296" y="250">In the practice</text>
<g>
<rect x="1226" y="280" width="128" height="38" rx="19" fill="#7CC3F0"/><text class="chip" x="1290" y="305" text-anchor="middle">Staff web</text>
<rect x="1366" y="280" width="148" height="38" rx="19" fill="#7CC3F0"/><text class="chip" x="1440" y="305" text-anchor="middle">Front desk</text>
<rect x="1226" y="330" width="128" height="38" rx="19" fill="#7CC3F0"/><text class="chip" x="1290" y="355" text-anchor="middle">Providers</text>
<rect x="1366" y="330" width="148" height="38" rx="19" fill="#7CC3F0"/><text class="chip" x="1440" y="355" text-anchor="middle">Care teams</text>
</g>
<rect x="1226" y="392" width="288" height="92" rx="12" fill="#10283A" stroke="#F4A07C" stroke-width="2"/>
<text class="h3" x="1370" y="432" text-anchor="middle" style="font-size:22px">All patient data</text>
<text class="lbl" x="1370" y="462" text-anchor="middle">One office appliance</text>

<!-- QR pairing -->
<rect class="hot" x="560" y="580" width="480" height="140" rx="18"/>
<g transform="translate(590 602)">
<rect width="96" height="96" rx="6" fill="#F7FBFD"/>
<g fill="#10283A"><rect x="8" y="8" width="24" height="24"/><rect x="64" y="8" width="24" height="24"/><rect x="8" y="64" width="24" height="24"/></g>
<g fill="#F7FBFD"><rect x="12" y="12" width="16" height="16"/><rect x="68" y="12" width="16" height="16"/><rect x="12" y="68" width="16" height="16"/></g>
<g fill="#10283A"><rect x="16" y="16" width="8" height="8"/><rect x="72" y="16" width="8" height="8"/><rect x="16" y="72" width="8" height="8"/><rect x="40" y="8" width="6" height="6"/><rect x="50" y="14" width="6" height="6"/><rect x="40" y="24" width="6" height="6"/><rect x="40" y="40" width="6" height="6"/><rect x="50" y="40" width="6" height="6"/><rect x="62" y="44" width="6" height="6"/><rect x="74" y="40" width="6" height="6"/><rect x="84" y="50" width="6" height="6"/><rect x="8" y="42" width="6" height="6"/><rect x="20" y="48" width="6" height="6"/><rect x="30" y="40" width="6" height="6"/><rect x="44" y="52" width="6" height="6"/><rect x="56" y="58" width="6" height="6"/><rect x="40" y="64" width="6" height="6"/><rect x="50" y="74" width="6" height="6"/><rect x="40" y="84" width="6" height="6"/><rect x="64" y="64" width="6" height="6"/><rect x="74" y="70" width="6" height="6"/><rect x="84" y="62" width="6" height="6"/><rect x="66" y="80" width="6" height="6"/><rect x="80" y="84" width="6" height="6"/></g>
</g>
<text class="h3" x="712" y="640">QR pairing</text>
<text class="body" x="712" y="672">One scan at the front desk</text>
<text class="body" x="712" y="698">ties this phone to this office.</text>

<!-- Connectors -->
<path d="M404 415 H626" stroke="#7CC3F0" stroke-width="4" fill="none" marker-start="url(#ab)" marker-end="url(#ab)"/>
<path d="M974 415 H1196" stroke="#7CC3F0" stroke-width="4" fill="none" marker-start="url(#ab)" marker-end="url(#ab)"/>
<text class="lbl" x="515" y="400" text-anchor="middle">pinned TLS</text>
<text class="lbl" x="1085" y="400" text-anchor="middle">outbound SSH</text>
<path d="M800 278 V316" stroke="#8FA9BC" stroke-width="3" stroke-dasharray="7 6" fill="none" marker-end="url(#ag)"/>
<path d="M630 338 L404 262" stroke="#8FA9BC" stroke-width="3" stroke-dasharray="7 6" fill="none" marker-end="url(#ag)"/>
<text class="lbl" x="520" y="282" text-anchor="middle" transform="rotate(18.6 520 282)">serves the site</text>
<path d="M230 514 V650 H556" stroke="#F4A07C" stroke-width="4" fill="none" marker-end="url(#aw)"/>
<path d="M1370 514 V650 H1044" stroke="#F4A07C" stroke-width="4" fill="none" marker-end="url(#aw)"/>
<text class="lbl warm" x="250" y="560">the phone’s device key</text>
<text class="lbl warm" x="1350" y="560" text-anchor="end">the office’s key</text>
</svg>
