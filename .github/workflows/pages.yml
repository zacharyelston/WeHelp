# Publishes presentation/ (the WeHelp overview deck) to GitHub Pages:
# https://zacharyelston.github.io/WeHelp/
# Static files only: no build step, no secrets.
name: pages

on:
  push:
    branches: [main]
    paths: ["presentation/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: presentation
      - id: deployment
        uses: actions/deploy-pages@v4
