name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: wehelp
          POSTGRES_PASSWORD: wehelp
          POSTGRES_DB: wehelp
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U wehelp"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      # Database integration tests (e.g. internal/registry) create and drop
      # their own databases through this URL; they skip when it is unset.
      WEHELP_TEST_DATABASE_URL: postgres://wehelp:wehelp@localhost:5432/wehelp?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # go.mod pins the patched toolchain (#43).
          go-version-file: go.mod
          cache: true
      - run: go build ./...
      - run: go vet ./...
      # Demo builds (seed command, #161) must keep compiling.
      - run: go vet -tags demo ./cmd/wehelp
      # Known vulnerabilities in the standard library and every module (#43).
      # Exits non-zero when our code reaches one.
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...
      # The Relay and Registry never import Back Office packages (no PHI
      # paths). Also part of go test; named here so a failure is plain.
      - name: Import boundaries
        run: go test -run TestImportBoundary ./cmd/wehelp-relay ./cmd/wehelp-registry
      - run: go test -race ./...
      # The staff web JavaScript (#195): the form evaluator against the shared
      # vectors in testdata/forms and the Forms tab tests. No packages.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Staff web JavaScript tests
        run: node --test web/*.test.js

  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate
        working-directory: ios
      - run: |
          xcodebuild -project ios/WeHelp.xcodeproj -scheme WeHelp \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build
      # Release hygiene (#43): build Release and inspect what would ship.
      - name: Release build check
        run: |
          xcodebuild -project ios/WeHelp.xcodeproj -scheme WeHelp -configuration Release \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build/release \
            CODE_SIGNING_ALLOWED=NO build
          scripts/check-ios-release.sh build/release/Build/Products/Release-iphonesimulator/WeHelp.app ios/WeHelp.xcodeproj

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f deploy/docker-compose.yml config --quiet
      - run: docker compose -f deploy/docker-compose.yml run --rm migrate
      - run: docker compose -f deploy/docker-compose.yml --profile registry run --rm registry-migrate
      - run: docker build -f deploy/Dockerfile -t wehelpd:field .
      # The field image has no demo seed command or demo logins, and runs as
      # nonroot (#161).
      - name: Field image check
        run: |
          [ "$(docker inspect -f '{{.Config.User}}' wehelpd:field)" = "65532" ] || { echo "image runs as root"; exit 1; }
          id=$(docker create wehelpd:field) && docker cp "$id":/usr/local/bin/wehelpd /tmp/wehelpd && docker rm "$id"
          if strings /tmp/wehelpd | grep -E 'wehelp-demo-|@demo\.wehelp'; then echo "demo logins in the field binary"; exit 1; fi
          # The field image must not know the command at all (not tied to its help text).
          if ! docker run --rm wehelpd:field seed 2>&1 | grep -q 'unknown command "seed"'; then echo "seed command in the field image"; exit 1; fi
          echo "field image ok"

  openapi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install openapi-spec-validator pyyaml
      - run: python -c "from openapi_spec_validator import validate; import yaml; validate(yaml.safe_load(open('api/openapi.yaml')))"
      - run: python -c "from openapi_spec_validator import validate; import yaml; validate(yaml.safe_load(open('api/registry.yaml')))"
