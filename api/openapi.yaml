openapi: 3.0.3
info:
  title: WeHelp API
  version: 1.0.0
  description: |
    WeHelp — open source software suite for healthcare providers.
    Provider-patient messaging, scheduling, check-ins, and an internal
    credit ledger. Designed for an on-prem appliance (~500 patients).
  license:
    name: AGPL-3.0
    url: https://www.gnu.org/licenses/agpl-3.0.html
servers:
  - url: /
    description: Local / on-prem
  - url: https://api.wehelp.example
    description: Cloud-hosted (same artifact)

# ---------------------------------------------------------------------------
# Security
# ---------------------------------------------------------------------------
security:
  - bearerAuth: []

components:
  securitySchemes:
    staffCookie:
      type: apiKey
      in: cookie
      name: __Host-wehelp_staff
      description: >
        Staff web session (#38): Secure, HttpOnly, SameSite=Strict. Office LAN
        only. Changes also need the session's CSRF token in X-CSRF-Token.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Short-lived HMAC JWT access token from /api/v1/auth/login or
        /api/v1/auth/refresh. Pass as `Authorization: Bearer <token>`.

  # -------------------------------------------------------------------------
  # Reusable parameters
  # -------------------------------------------------------------------------
  parameters:
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
      description: Page size for paginated listings.
    Unread:
      name: unread
      in: query
      required: false
      schema:
        type: boolean
        default: false
      description: Filter inbox to unread messages only.
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
      description: Opaque keyset cursor from a previous page's `next_cursor`.
    FromParam:
      name: from
      in: query
      required: false
      schema:
        type: string
        format: date-time
      description: Lower bound (inclusive) for appointment `starts_at`.
    ToParam:
      name: to
      in: query
      required: false
      schema:
        type: string
        format: date-time
      description: Upper bound (exclusive) for appointment `starts_at`.

  # -------------------------------------------------------------------------
  # Schemas
  # -------------------------------------------------------------------------
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string

    TokenResponse:
      type: object
      required: [access_token, refresh_token, token_type, expires_in]
      properties:
        access_token:
          type: string
          description: Short-lived HMAC JWT.
        refresh_token:
          type: string
          description: Opaque rotating refresh token (SHA-256 hashed at rest).
        token_type:
          type: string
          example: Bearer
        expires_in:
          type: integer
          description: Access token lifetime in seconds.
          example: 900

    RegisterRequest:
      type: object
      required: [tenant, email, password, role]
      properties:
        tenant:
          type: string
          description: Tenant name (created if new).
          example: Demo Clinic
        email:
          type: string
          format: email
          example: dr.shaw@demo.wehelp
        password:
          type: string
          format: password
          minLength: 12
          description: Must be at least 12 characters.
        role:
          type: string
          enum: [provider]
          description: >
            Self-serve registration is for providers only. Patients have no
            password: staff add them (POST /api/v1/patients) and they pair a
            phone in the office (#37).
        display_name:
          type: string
          example: Dr. Ada Shaw

    LoginRequest:
      type: object
      required: [tenant, email, password]
      properties:
        tenant:
          type: string
          example: Demo Clinic
        email:
          type: string
          format: email
        password:
          type: string
          format: password
        code:
          type: string
          description: >
            TOTP code, required for every staff account (#38). Patients
            can't sign in with a password; they pair a phone (#37).

    RefreshRequest:
      type: object
      description: >
        For a device-bound refresh token, `timestamp` and `signature` are
        required: a DER ECDSA-P256-SHA256 signature by the enrolled device key
        over `wehelp-device-v1\nrefresh\n{refresh_token}\n{timestamp}`,
        within ±5 minutes of server time. Patient accounts can only refresh
        device-bound tokens.
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
        timestamp:
          type: integer
          format: int64
          description: Unix seconds when the proof was signed.
        signature:
          type: string
          format: byte
          description: Base64 DER ECDSA signature by the device key.

    EnrollRequest:
      type: object
      description: >
        Swaps an unbound refresh token (from password login) for a token pair
        bound to this device. The signature proves possession of the private
        key: `wehelp-device-v1\nenroll\n{refresh_token}\n{timestamp}`.
      required: [refresh_token, public_key, timestamp, signature]
      properties:
        refresh_token:
          type: string
        public_key:
          type: string
          format: byte
          description: Base64 DER SubjectPublicKeyInfo, P-256 only.
        name:
          type: string
          maxLength: 100
          description: Device display name.
        timestamp:
          type: integer
          format: int64
        signature:
          type: string
          format: byte

    EnrollResponse:
      allOf:
        - $ref: "#/components/schemas/TokenResponse"
        - type: object
          required: [device_id]
          properties:
            device_id:
              type: string
              format: uuid

    LogoutRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string

    MeResponse:
      type: object
      required: [user_id, tenant_id, role]
      properties:
        user_id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        role:
          type: string
          enum: [provider, patient, admin]
        display_name: { type: string }

    LinkView:
      type: object
      required: [provider_id, patient_id, status]
      properties:
        provider_id:
          type: string
          format: uuid
        patient_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [pending, active, revoked]
        provider_name: { type: string }
        patient_name: { type: string }

    CreateLinkRequest:
      type: object
      required: [patient_email]
      properties:
        patient_email:
          type: string
          format: email
          description: Email of an existing patient in the same tenant.

    MessageView:
      type: object
      required: [id, sender_id, recipient_id, kind, body, metadata, created_at]
      properties:
        id:
          type: string
          format: uuid
        sender_id:
          type: string
          format: uuid
        recipient_id:
          type: string
          format: uuid
        kind:
          type: string
          enum: [message, memo, checkin, reminder]
        body:
          type: string
        metadata:
          type: object
          description: Kind-specific JSON payload (e.g. check-in reading).
          additionalProperties: true
        read_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time

    CreateMessageRequest:
      type: object
      required: [recipient_id, body]
      properties:
        recipient_id:
          type: string
          format: uuid
        kind:
          type: string
          enum: [message, memo, checkin, reminder]
          default: message
        body:
          type: string
          minLength: 1
        metadata:
          type: object
          additionalProperties: true
          description: Optional JSON object; defaults to `{}`.

    MessageListResponse:
      type: object
      required: [messages]
      properties:
        messages:
          type: array
          items:
            $ref: "#/components/schemas/MessageView"
        next_cursor:
          type: string
          description: Opaque cursor for the next page; absent if no more results.

    AppointmentView:
      type: object
      required: [id, provider_id, patient_id, starts_at, ends_at, status, created_at]
      properties:
        id:
          type: string
          format: uuid
        provider_id:
          type: string
          format: uuid
        patient_id:
          type: string
          format: uuid
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
        status:
          type: string
          enum: [scheduled, cancelled, completed, no_show]
        created_at:
          type: string
          format: date-time

    CreateAppointmentRequest:
      type: object
      required: [patient_id, starts_at, ends_at]
      properties:
        patient_id:
          type: string
          format: uuid
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
        status:
          type: string
          enum: [scheduled, cancelled, completed, no_show]
          default: scheduled

    UpdateAppointmentRequest:
      type: object
      properties:
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
        status:
          type: string
          enum: [scheduled, cancelled, completed, no_show]

    AppointmentListResponse:
      type: object
      required: [appointments]
      properties:
        appointments:
          type: array
          items:
            $ref: "#/components/schemas/AppointmentView"

    PatientView:
      type: object
      required: [id, display_name, email, devices]
      properties:
        id: { type: string, format: uuid }
        display_name: { type: string }
        email: { type: string, format: email }
        link_status: { type: string, enum: [pending, active] }
        devices: { type: integer, description: Paired phones that are not revoked. }
        last_seen_at: { type: string, format: date-time }

    CreatePatientRequest:
      type: object
      required: [display_name, email]
      properties:
        display_name: { type: string, example: Jordan Lee }
        email: { type: string, format: email }

    CreateInviteRequest:
      type: object
      description: >
        The account to pair: user_id (any role) or, as before, patient_id.
        Patients: a provider linked to them, or an admin. Staff accounts:
        yourself, or anyone in the practice if you are an admin (#69).
      properties:
        user_id: { type: string, format: uuid }
        patient_id: { type: string, format: uuid }

    InviteResponse:
      type: object
      required: [id, patient_id, patient_name, expires_at, qr_payload, qr_png]
      properties:
        id: { type: string, format: uuid }
        patient_id: { type: string, format: uuid }
        patient_name: { type: string, description: The paired account's display name (any role). }
        role: { type: string, enum: [patient, provider, admin] }
        expires_at: { type: string, format: date-time, description: Redeem deadline (10 minutes). }
        qr_payload:
          type: string
          description: >
            The JSON in the QR code: v (1), relay, relay_pin, office, key_pin
            and the single-use invite code. Shown once; only its hash is stored.
        qr_png: { type: string, format: byte, description: Base64 PNG of the QR code. }

    InviteStatus:
      type: object
      required: [id, status]
      properties:
        id: { type: string, format: uuid }
        status:
          type: string
          enum: [issued, paired, expired]
        device_name: { type: string, description: Set once a phone has paired. }

    RedeemRequest:
      type: object
      required: [invite, public_key, timestamp, signature]
      properties:
        invite: { type: string }
        public_key: { type: string, format: byte, description: "Base64 DER SubjectPublicKeyInfo, P-256." }
        name: { type: string, maxLength: 100 }
        timestamp: { type: integer, format: int64 }
        signature:
          type: string
          format: byte
          description: DER ECDSA-SHA256 over "wehelp-device-v1\npair\n{invite}\n{timestamp}".

    RedeemResponse:
      allOf:
        - $ref: "#/components/schemas/EnrollResponse"
        - type: object
          required: [practice, patient_name]
          properties:
            practice: { type: string }
            patient_name: { type: string }
            role: { type: string, enum: [patient, provider, admin], description: The device's session role. }


    DeviceView:
      type: object
      required: [id, name, created_at, status]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, example: "Jordan's iPhone" }
        created_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time }
        revoked_at: { type: string, format: date-time }
        status: { type: string, enum: [active, revoked] }
        current: { type: boolean, description: True for the device making the request. }

    DeviceList:
      type: object
      required: [devices]
      properties:
        devices:
          type: array
          items:
            $ref: "#/components/schemas/DeviceView"

    StaffLoginRequest:
      type: object
      required: [tenant, email, password]
      properties:
        tenant: { type: string, example: Demo Clinic }
        email: { type: string, format: email }
        password: { type: string, format: password }
        code: { type: string, description: "TOTP code; omit only on the first sign-in, before TOTP is set up." }

    StaffMe:
      type: object
      required: [status, user_id, role, csrf_token]
      properties:
        status:
          type: string
          enum: [active, totp_setup]
          description: totp_setup means the session can only set up TOTP.
        user_id: { type: string, format: uuid }
        role: { type: string, enum: [provider, admin] }
        display_name: { type: string }
        practice: { type: string }
        csrf_token: { type: string, description: Send as X-CSRF-Token on every change. }

    TOTPSetup:
      type: object
      required: [secret, otpauth_url, qr_png]
      properties:
        secret: { type: string, description: "Base32, for manual entry." }
        otpauth_url: { type: string }
        qr_png: { type: string, format: byte }

    ConversationView:
      type: object
      required: [user_id, name, role, link_status, last_from_me, unread_count]
      properties:
        user_id: { type: string, format: uuid }
        name: { type: string }
        role: { type: string, enum: [provider, patient, admin] }
        link_status: { type: string, enum: [pending, active] }
        last_body: { type: string }
        last_at: { type: string, format: date-time }
        last_from_me: { type: boolean }
        unread_count: { type: integer }

# ---------------------------------------------------------------------------
# Paths
# ---------------------------------------------------------------------------
paths:
  /healthz:
    get:
      tags: [health]
      summary: Process health check
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /readyz:
    get:
      tags: [health]
      summary: Database readiness check
      security: []
      responses:
        "200":
          description: DB reachable
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
        "503":
          description: DB unreachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/ping:
    get:
      tags: [health]
      summary: Authenticated ping
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: pong

  # -------------------------------------------------------------------------
  # Auth
  # -------------------------------------------------------------------------
  /api/v1/auth/register:
    post:
      tags: [auth]
      summary: Register a new tenant + user
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Email already registered in this tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/auth/login:
    post:
      tags: [auth]
      summary: Log in with email + password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/auth/refresh:
    post:
      tags: [auth]
      summary: Rotate refresh token and get a new token pair
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "401":
          description: >
            Invalid or expired refresh token, a failed device proof, a revoked
            device, or a patient token that is not device-bound.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/auth/enroll:
    post:
      tags: [auth]
      summary: Enroll this device and get a device-bound token pair
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnrollRequest"
      responses:
        "201":
          description: Device enrolled; the login refresh token is consumed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnrollResponse"
        "400":
          description: Malformed body or a public key that is not P-256 SPKI.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Invalid refresh token or failed device proof.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Session already device-bound, or the key is already enrolled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/auth/logout:
    post:
      tags: [auth]
      summary: Revoke a session (and its device, if device-bound)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LogoutRequest"
      responses:
        "204":
          description: >
            Revoked. For a device-bound token, the device and all its tokens
            are revoked. Unknown or expired tokens also return 204.
        "400":
          description: Malformed body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # -------------------------------------------------------------------------
  # Me
  # -------------------------------------------------------------------------
  /api/v1/me:
    get:
      tags: [me]
      summary: Return the authenticated identity
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # -------------------------------------------------------------------------
  # Links
  # -------------------------------------------------------------------------
  /api/v1/links:
    post:
      tags: [links]
      summary: Invite a patient by email (provider only)
      description: Creates a pending provider-patient link.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLinkRequest"
      responses:
        "201":
          description: Link created (pending)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LinkView"
        "400":
          description: Invalid request or user is not a patient
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Only providers can invite patients
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No patient with that email in this tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Link already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    get:
      tags: [links]
      summary: List the caller's links (provider or patient side)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LinkView"
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/links/{userID}/accept:
    post:
      tags: [links]
      summary: Accept a pending invite (patient only)
      description: "`{userID}` is the provider's user ID."
      parameters:
        - name: userID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Link activated
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: active
        "403":
          description: Only patients can accept invites
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No pending invite from that provider
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/links/{userID}/revoke:
    post:
      tags: [links]
      summary: Revoke a pending or active link (either party)
      description: "`{userID}` is the other party's user ID."
      parameters:
        - name: userID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Link revoked
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: revoked
        "404":
          description: No link with that user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # -------------------------------------------------------------------------
  # Messages
  # -------------------------------------------------------------------------
  /api/v1/messages:
    post:
      tags: [messages]
      summary: Send a message
      description: |
        Requires an active provider-patient link (either direction) with
        the recipient. Kind defaults to `message` if omitted. Metadata
        must be a JSON object (or omitted/null for `{}`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMessageRequest"
      responses:
        "201":
          description: Message sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  kind:
                    type: string
        "400":
          description: Invalid request (bad kind, empty body, self-message, bad metadata)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: No active link with that user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    get:
      tags: [messages]
      summary: List the caller's inbox, or one conversation with ?with= (newest first, keyset-paginated)
      parameters:
        - $ref: "#/components/parameters/Unread"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: with
          in: query
          required: false
          schema: { type: string, format: uuid }
          description: >
            A linked user's ID: return the whole thread with them, both
            directions (#67). Unread is ignored. 404 if not linked. Each
            thread read is audited.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageListResponse"
        "400":
          description: Invalid limit, cursor or with
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No conversation with that user (not linked)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/conversations:
    get:
      tags: [messages]
      summary: Everyone you're linked with, with the latest message and unread count (#67)
      responses:
        "200":
          description: Conversations with messages first, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [conversations]
                properties:
                  conversations:
                    type: array
                    items:
                      $ref: "#/components/schemas/ConversationView"

  /api/v1/messages/{messageID}/read:
    post:
      tags: [messages]
      summary: Mark a message as read (recipient only, idempotent)
      parameters:
        - name: messageID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Marked read or already read
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [read, "already read"]
        "404":
          description: Message not found or not addressed to caller
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # -------------------------------------------------------------------------
  # Appointments (M2 — planned, not yet implemented)
  # -------------------------------------------------------------------------
  /api/v1/appointments:
    post:
      tags: [appointments]
      summary: Create an appointment (provider only)
      description: |
        Requires an active provider-patient link. The provider cannot
        double-book — overlapping appointments are rejected with 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAppointmentRequest"
      responses:
        "201":
          description: Appointment created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppointmentView"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Not a provider or no active link with patient
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Overlapping appointment exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    get:
      tags: [appointments]
      summary: List appointments scoped to the caller
      description: |
        Providers see their appointments; patients see appointments where
        they are the patient. Optional `from`/`to` bounds on `starts_at`.
      parameters:
        - $ref: "#/components/parameters/FromParam"
        - $ref: "#/components/parameters/ToParam"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppointmentListResponse"

  /api/v1/appointments/{appointmentID}:
    patch:
      tags: [appointments]
      summary: Update an appointment (reschedule and/or status transition)
      description: |
        Provider can reschedule (new `starts_at`/`ends_at`) and/or change
        status (`scheduled` → `cancelled` | `completed` | `no_show`).
        Rescheduling re-checks for overlaps.
      parameters:
        - name: appointmentID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAppointmentRequest"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppointmentView"
        "403":
          description: Not the provider
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Appointment not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Reschedule would overlap an existing appointment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/patients:
    get:
      tags: [pairing]
      summary: List your patients and their paired phones (staff)
      responses:
        "200":
          description: Patients.
          content:
            application/json:
              schema:
                type: object
                required: [patients]
                properties:
                  patients:
                    type: array
                    items:
                      $ref: "#/components/schemas/PatientView"
        "403":
          description: Not staff.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      tags: [pairing]
      summary: Add a patient with no password (staff, office LAN only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePatientRequest"
      responses:
        "201":
          description: Created; a provider is linked to the new patient.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatientView"
        "400":
          description: Missing name or email.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Not staff, or the request came through the Relay.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Email already used in this practice.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/pairing/invites:
    post:
      tags: [pairing]
      summary: Issue a QR pairing invite for one patient (staff, office LAN only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInviteRequest"
      responses:
        "201":
          description: Invite issued; show the QR code.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InviteResponse"
        "403":
          description: Not staff, or the request came through the Relay.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No such patient for this staff member.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: The office is not installed with the Registry yet.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/pairing/invites/{inviteID}:
    get:
      tags: [pairing]
      summary: Whether an invite has been used (staff, office LAN only)
      parameters:
        - { name: inviteID, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InviteStatus"
        "403":
          description: Not staff, or the request came through the Relay.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/pairing/redeem:
    post:
      tags: [pairing]
      summary: Redeem a scanned invite; enrolls this phone and signs it in
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RedeemRequest"
      responses:
        "200":
          description: Paired; the device-bound session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RedeemResponse"
        "400":
          description: Malformed body or key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Invalid or expired invite, or a failed device proof.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: This key is already enrolled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/devices:
    get:
      tags: [devices]
      summary: List your own devices
      responses:
        "200":
          description: Devices, active first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceList"
        "401":
          description: Not signed in, or this device was revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/devices/{deviceID}:
    delete:
      tags: [devices]
      summary: Revoke one of your own devices
      description: >
        Revokes the device and all its refresh tokens; its access tokens stop
        working at once. Revoking the current device signs it out. Revoking an
        already revoked device succeeds.
      parameters:
        - { name: deviceID, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204":
          description: Revoked.
        "404":
          description: Not one of your devices.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/patients/{patientID}/devices:
    get:
      tags: [devices]
      summary: List a patient's devices (staff, office LAN only)
      parameters:
        - { name: patientID, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Devices, active first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceList"
        "403":
          description: Not staff, or the request came through the Relay.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No such patient for this staff member.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/patients/{patientID}/devices/{deviceID}:
    delete:
      tags: [devices]
      summary: Revoke a patient's device (staff, office LAN only)
      parameters:
        - { name: patientID, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: deviceID, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204":
          description: Revoked; the device is locked out at once.
        "403":
          description: Not staff, or the request came through the Relay.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No such patient for this staff member, or not that patient's device.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/staff/login:
    post:
      tags: [staff]
      summary: Staff sign-in with password + TOTP (office LAN only)
      description: >
        Sets the session cookie. Without TOTP set up yet, returns status
        totp_setup and a session that can only set it up. Five failures lock
        the account for 15 minutes. Through the Relay this route is a 404.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StaffLoginRequest"
      responses:
        "200":
          description: Signed in (or ready for TOTP setup).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffMe"
        "401":
          description: Invalid credentials, code or locked account (one answer for all).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Through the Relay.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/staff/totp/setup:
    post:
      tags: [staff]
      summary: Create a TOTP secret (setup session only)
      security: [{ staffCookie: [] }]
      responses:
        "200":
          description: Scan the QR code with an authenticator app.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TOTPSetup"
        "401":
          description: No setup session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Missing or invalid CSRF token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/staff/totp/confirm:
    post:
      tags: [staff]
      summary: Turn TOTP on with a code; replaces the setup session with a full one
      security: [{ staffCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string }
      responses:
        "200":
          description: TOTP on; signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffMe"
        "401":
          description: Wrong code, or no setup session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Missing or invalid CSRF token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Setup not started.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/staff/me:
    get:
      tags: [staff]
      summary: The signed-in staff member and the CSRF token
      security: [{ staffCookie: [] }]
      responses:
        "200":
          description: Signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffMe"
        "401":
          description: Not signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/staff/logout:
    post:
      tags: [staff]
      summary: End the staff session
      security: [{ staffCookie: [] }]
      responses:
        "204":
          description: Signed out; the cookie is cleared.
        "403":
          description: Missing or invalid CSRF token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
