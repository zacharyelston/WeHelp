openapi: 3.0.3
info:
  title: WeHelp API
  version: 1.0.0
  description: |
    WeHelp — open source software suite for healthcare providers.
    Provider-patient messaging, scheduling, check-ins, and an internal
    credit ledger. Designed for an on-prem appliance (~500 patients).
  license:
    name: AGPL-3.0
    url: https://www.gnu.org/licenses/agpl-3.0.html
servers:
  - url: /
    description: Local / on-prem
  - url: https://api.wehelp.example
    description: Cloud-hosted (same artifact)

# ---------------------------------------------------------------------------
# Security
# ---------------------------------------------------------------------------
security:
  - bearerAuth: []

components:
  securitySchemes:
    staffCookie:
      type: apiKey
      in: cookie
      name: __Host-wehelp_staff
      description: >
        Staff web session (#38): Secure, HttpOnly, SameSite=Strict. Office LAN
        only. Changes also need the session's CSRF token in X-CSRF-Token.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Short-lived HMAC JWT access token from /api/v1/auth/login or
        /api/v1/auth/refresh. Pass as `Authorization: Bearer <token>`.

  # -------------------------------------------------------------------------
  # Reusable parameters
  # -------------------------------------------------------------------------
  parameters:
    TeamPatientID:
      name: patientID
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Whose care team (#111).
    TeamMemberID:
      name: memberID
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: A provider on the care team (#111).
    ProviderUserID:
      name: userID
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: A provider account in the admin's practice (#100).
    RequestID:
      name: requestID
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: An appointment request (#68).
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
      description: Page size for paginated listings.
    Unread:
      name: unread
      in: query
      required: false
      schema:
        type: boolean
        default: false
      description: Filter inbox to unread messages only.
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
      description: Opaque keyset cursor from a previous page's `next_cursor`.
    FromParam:
      name: from
      in: query
      required: false
      schema:
        type: string
        format: date-time
      description: Lower bound (inclusive) for appointment `starts_at`.
    ToParam:
      name: to
      in: query
      required: false
      schema:
        type: string
        format: date-time
      description: Upper bound (exclusive) for appointment `starts_at`.

  # -------------------------------------------------------------------------
  # Schemas
  # -------------------------------------------------------------------------
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: Human-readable; may change. Branch on `code`.
        code:
          type: string
          description: >
            Stable machine-readable code, present where the status alone
            is ambiguous (#136). Apps must tolerate codes they don't know.
            Refresh: `invalid_token` (unknown, used or expired; sign out),
            `not_enrolled` (sign out), `device_revoked` (sign out),
            `proof_failed` (sign out), `proof_timestamp` (the device clock
            is off; keep the session and ask the user to fix the clock).

    FormVersionSummary:
      type: object
      description: One version of a form, without its definition (#194).
      required: [id, version, status, digest, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        version: { type: integer, minimum: 1 }
        status: { type: string, enum: [draft, published] }
        digest: { type: string, description: "Hex SHA-256 of the canonical definition JSON." }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        published_at: { type: string, format: date-time }
    FormSummary:
      type: object
      description: A form in the practice's library (#194). Practice content, not patient data.
      required: [id, name, kind, created_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        kind: { type: string, enum: [custom, instrument], description: "Built-in instruments are read-only." }
        instrument_key: { type: string }
        created_at: { type: string, format: date-time }
        archived_at: { type: string, format: date-time }
        latest: { $ref: "#/components/schemas/FormVersionSummary" }
        published: { type: integer, description: "The highest published version number." }
    FormDefinition:
      type: object
      description: >
        A wehelp.form.v1 definition. The full JSON Schema is
        schemas/wehelp.form.v1.json; internal/forms is the reference
        validator. At most 200,000 bytes.
      required: [format, title, sections]
      properties:
        format: { type: string, enum: [wehelp.form.v1] }
        title: { type: string }
      additionalProperties: true
    FormDefinitionError:
      type: object
      description: The definition failed validation (#193). path names the field.
      required: [error, code, path, kind]
      properties:
        error: { type: string, example: 'sections[0].pages[1].items[2].options: duplicate value "1"' }
        code: { type: string, enum: [invalid_definition] }
        path: { type: string }
        kind:
          type: string
          enum: [json, size, schema, duplicate, reference, order, type, operator, depth, nodes, items, range]
    FormAsset:
      type: object
      description: An image on a form version (#195).
      required: [name, content_type, size, sha256, created_at]
      properties:
        name: { type: string }
        content_type: { type: string, enum: [image/png, image/jpeg] }
        size: { type: integer }
        sha256: { type: string }
        created_at: { type: string, format: date-time }
    FormVersion:
      allOf:
        - $ref: "#/components/schemas/FormVersionSummary"
        - type: object
          required: [form_id, form_name, kind, definition]
          properties:
            form_id: { type: string, format: uuid }
            form_name: { type: string }
            kind: { type: string, enum: [custom, instrument] }
            definition: { $ref: "#/components/schemas/FormDefinition" }
            assets:
              type: array
              items: { $ref: "#/components/schemas/FormAsset" }

    FormSchedule:
      type: object
      description: >
        When an assignment's occurrences are due (#196). Due dates follow the
        practice's calendar in the assignment's pinned time zone; every due,
        opening and closing time is 09:00 local. A repeating schedule must end
        (count or until); at most 366 occurrences.
      required: [kind, start_date]
      properties:
        kind: { type: string, enum: [once, days, weeks] }
        every: { type: integer, minimum: 1, maximum: 365, description: "Every N days or weeks. 1 for once." }
        start_date: { type: string, format: date, description: "The first due date." }
        count: { type: integer, minimum: 1, maximum: 366 }
        until: { type: string, format: date, description: "The last possible due date (inclusive)." }
    FormOccurrence:
      type: object
      description: One due instance of an assignment (#196). Its window opens at opens_at (inclusive) and closes at closes_at (exclusive).
      required: [id, assignment_id, version_id, version, due_date, opens_at, due_at, closes_at, status, state]
      properties:
        id: { type: string, format: uuid }
        assignment_id: { type: string, format: uuid }
        version_id: { type: string, format: uuid, description: "Pinned when the occurrence was created." }
        version: { type: integer }
        due_date: { type: string, format: date }
        opens_at: { type: string, format: date-time }
        due_at: { type: string, format: date-time }
        closes_at: { type: string, format: date-time }
        status: { type: string, enum: [open, completed, missed, cancelled] }
        state: { type: string, enum: [upcoming, open, completed, missed, cancelled], description: "status open split by the window." }
        completed_at: { type: string, format: date-time }
    FormAssignment:
      type: object
      description: A form given to a patient once or on a schedule (#196).
      required: [id, patient_id, form_id, form_name, schedule, open_before_days, close_after_days, timezone, channel, assigned_by, created_at, occurrences]
      properties:
        id: { type: string, format: uuid }
        patient_id: { type: string, format: uuid }
        form_id: { type: string, format: uuid }
        form_name: { type: string }
        version_id: { type: string, format: uuid, nullable: true, description: "null: each occurrence takes the latest published version." }
        schedule: { $ref: "#/components/schemas/FormSchedule" }
        open_before_days: { type: integer }
        close_after_days: { type: integer }
        timezone: { type: string, description: "The practice's zone, pinned." }
        channel: { type: string, enum: [app, kiosk] }
        assigned_by: { type: string, format: uuid }
        assigned_by_name: { type: string }
        created_at: { type: string, format: date-time }
        ended_at: { type: string, format: date-time }
        occurrences:
          type: array
          items: { $ref: "#/components/schemas/FormOccurrence" }
    MyForm:
      type: object
      description: One of the patient's open or upcoming forms (#196).
      required: [occurrence_id, assignment_id, form_id, version_id, title, state, opens_at, due_at, closes_at, response]
      properties:
        occurrence_id: { type: string, format: uuid }
        assignment_id: { type: string, format: uuid }
        form_id: { type: string, format: uuid }
        version_id: { type: string, format: uuid }
        title: { type: string, description: "The version's definition title." }
        state: { type: string, enum: [open, upcoming] }
        opens_at: { type: string, format: date-time }
        due_at: { type: string, format: date-time }
        closes_at: { type: string, format: date-time }
        response:
          type: object
          nullable: true
          description: The in-progress response to resume (#197), or null.
          properties:
            id: { type: string, format: uuid }
            status: { type: string, enum: [in_progress] }
            revision: { type: integer }
    DueOccurrence:
      type: object
      required: [occurrence_id, patient_id, patient_name, form_name, due_at, closes_at, status, providers]
      properties:
        occurrence_id: { type: string, format: uuid }
        patient_id: { type: string, format: uuid }
        patient_name: { type: string }
        form_name: { type: string }
        due_at: { type: string, format: date-time }
        closes_at: { type: string, format: date-time }
        status: { type: string, enum: [open, missed] }
        providers:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              name: { type: string }
    FormScore:
      type: object
      description: A computed score (#193). value is a canonical decimal string, or null with a reason.
      properties:
        value: { type: string, nullable: true }
        band: { type: string, nullable: true }
        reason: { type: string, enum: [missing, divideByZero, belowMinAnswered, overflow] }
    FormFlag:
      type: object
      description: A staff-side flag the response raised (#199), such as self_harm for PHQ-9 item 9. Never sent to the patient.
      properties:
        id: { type: string }
        text: { type: string }
    FormSavedPage:
      type: object
      properties:
        page_id: { type: string }
        answers: { type: object, additionalProperties: true }
        saved_at: { type: string, format: date-time }
    FormResponse:
      type: object
      description: A response in progress (#197), with the latest save of each page for resume.
      required: [id, version_id, status, revision, started_at, pages, answers]
      properties:
        id: { type: string, format: uuid }
        occurrence_id: { type: string, format: uuid }
        version_id: { type: string, format: uuid }
        status: { type: string, enum: [in_progress, submitted, expired] }
        revision: { type: integer, description: "Send it back as If-Match on the next page save." }
        started_at: { type: string, format: date-time }
        closes_at: { type: string, format: date-time }
        pages:
          type: array
          description: The latest save of each page, in document order.
          items: { $ref: "#/components/schemas/FormSavedPage" }
        answers: { type: object, additionalProperties: true, description: "All saved pages merged." }
    FormAnswerErrors:
      type: object
      required: [error, code]
      properties:
        error: { type: string }
        code: { type: string, enum: [invalid_answers, score_overflow] }
        errors:
          type: array
          items:
            type: object
            properties:
              item: { type: string }
              page_id: { type: string }
              code: { type: string, enum: [unknown_item, not_answerable, wrong_type, unknown_option, duplicate_option, out_of_range, too_long, required] }
              message: { type: string }
    TokenResponse:
      type: object
      required: [access_token, refresh_token, token_type, expires_in]
      properties:
        access_token:
          type: string
          description: Short-lived HMAC JWT.
        refresh_token:
          type: string
          description: Opaque rotating refresh token (SHA-256 hashed at rest).
        token_type:
          type: string
          example: Bearer
        expires_in:
          type: integer
          description: Access token lifetime in seconds.
          example: 900

    RegisterRequest:
      type: object
      required: [tenant, email, password, role]
      properties:
        tenant:
          type: string
          description: Tenant name (created if new).
          example: Demo Clinic
        email:
          type: string
          format: email
          example: dr.shaw@demo.wehelp
        password:
          type: string
          format: password
          minLength: 12
          description: Must be at least 12 characters.
        role:
          type: string
          enum: [provider]
          description: >
            Self-serve registration is for providers only. Patients have no
            password: staff add them (POST /api/v1/patients) and they pair a
            phone in the office (#37).
        display_name:
          type: string
          example: Dr. Ada Shaw

    LoginRequest:
      type: object
      required: [tenant, email, password]
      properties:
        tenant:
          type: string
          example: Demo Clinic
        email:
          type: string
          format: email
        password:
          type: string
          format: password
        code:
          type: string
          description: >
            TOTP code, required for every staff account (#38). Patients
            can't sign in with a password; they pair a phone (#37).

    RefreshRequest:
      type: object
      description: >
        For a device-bound refresh token, `timestamp` and `signature` are
        required: a DER ECDSA-P256-SHA256 signature by the enrolled device key
        over `wehelp-device-v1\nrefresh\n{refresh_token}\n{timestamp}`,
        within ±5 minutes of server time. Patient accounts can only refresh
        device-bound tokens.
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
        timestamp:
          type: integer
          format: int64
          description: Unix seconds when the proof was signed.
        signature:
          type: string
          format: byte
          description: Base64 DER ECDSA signature by the device key.

    EnrollRequest:
      type: object
      description: >
        Swaps an unbound refresh token (from password login) for a token pair
        bound to this device. The signature proves possession of the private
        key: `wehelp-device-v1\nenroll\n{refresh_token}\n{timestamp}`.
      required: [refresh_token, public_key, timestamp, signature]
      properties:
        refresh_token:
          type: string
        public_key:
          type: string
          format: byte
          description: Base64 DER SubjectPublicKeyInfo, P-256 only.
        name:
          type: string
          maxLength: 100
          description: Device display name.
        timestamp:
          type: integer
          format: int64
        signature:
          type: string
          format: byte

    EnrollResponse:
      allOf:
        - $ref: "#/components/schemas/TokenResponse"
        - type: object
          required: [device_id]
          properties:
            device_id:
              type: string
              format: uuid

    LogoutRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string

    MeResponse:
      type: object
      required: [user_id, tenant_id, role]
      properties:
        user_id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        role:
          type: string
          enum: [provider, patient, admin, office]
        display_name: { type: string }
        demo:
          type: boolean
          description: |
            Present (true) only from a demo build. The app then skips its
            Face ID or passcode lock for this practice, for testing on
            borrowed devices. A practice's Back Office never sends it.

    LinkView:
      type: object
      required: [provider_id, patient_id, status]
      properties:
        provider_id:
          type: string
          format: uuid
        patient_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [pending, active, revoked]
        provider_name: { type: string }
        patient_name: { type: string }
        checkin_every_days:
          type: integer
          nullable: true
          description: Check-in reminder cadence in days; null when off.

    CreateLinkRequest:
      type: object
      required: [patient_email]
      properties:
        patient_email:
          type: string
          format: email
          description: Email of an existing patient in the same tenant.

    MessageView:
      type: object
      required: [id, sender_id, recipient_id, kind, body, metadata, created_at]
      properties:
        id:
          type: string
          format: uuid
        sender_id:
          type: string
          format: uuid
        recipient_id:
          type: string
          format: uuid
        kind:
          type: string
          enum: [message, memo, checkin, reminder]
        body:
          type: string
        metadata:
          type: object
          description: Kind-specific JSON payload (e.g. check-in reading).
          additionalProperties: true
        read_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time

    CreateMessageRequest:
      type: object
      required: [recipient_id, body]
      properties:
        recipient_id:
          type: string
          format: uuid
        kind:
          type: string
          enum: [message, memo, checkin, reminder]
          default: message
        body:
          type: string
          minLength: 1
        metadata:
          type: object
          additionalProperties: true
          description: Optional JSON object; defaults to `{}`.

    MessageListResponse:
      type: object
      required: [messages]
      properties:
        messages:
          type: array
          items:
            $ref: "#/components/schemas/MessageView"
        next_cursor:
          type: string
          description: Opaque cursor for the next page; absent if no more results.

    AppointmentView:
      type: object
      required: [id, provider_id, patient_id, starts_at, ends_at, status, created_at]
      properties:
        id:
          type: string
          format: uuid
        provider_id:
          type: string
          format: uuid
        patient_id:
          type: string
          format: uuid
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
        status:
          type: string
          enum: [scheduled, cancelled, completed, no_show]
        created_at:
          type: string
          format: date-time
        provider_name: { type: string, description: "In lists (#106)." }
        patient_name: { type: string, description: "In lists (#106)." }
        visit_status:
          type: string
          enum: [open, ended]
          description: "In lists (#6): the video visit's state; absent if none was started. The patient's Join button shows while it is open."
        visit_opened_at: { type: string, format: date-time }
        visit_ended_at: { type: string, format: date-time }

    VisitJoin:
      type: object
      required: [visit_id, role, peer_present, after, ice_servers, expires_at]
      properties:
        visit_id: { type: string, format: uuid }
        role: { type: string, enum: [provider, patient] }
        peer_present: { type: boolean, description: The other party's device is in the call. }
        after: { type: integer, description: Poll signals after this sequence. }
        ice_servers:
          type: array
          description: "Pass to RTCConfiguration with iceTransportPolicy = relay. TURN REST credentials, valid until expires_at."
          items:
            type: object
            required: [urls, username, credential]
            properties:
              urls: { type: array, items: { type: string } }
              username: { type: string }
              credential: { type: string }
        expires_at: { type: string, format: date-time, description: The end of the join window. }

    VisitSignal:
      type: object
      required: [seq, from, type]
      properties:
        seq: { type: integer }
        from: { type: string, enum: [provider, patient, server] }
        type:
          type: string
          enum: [offer, answer, candidate, restart, joined, left, ended, replaced]
          description: |
            From the other phone: offer (always the provider), answer (always
            the patient), candidate, restart (the patient asking for a fresh
            offer). From the Back Office or about the other side: joined,
            left, ended, replaced (this visit moved to another of your devices).
        sdp: { type: string }
        candidate: { type: object, additionalProperties: true }

    PreferredTime:
      type: object
      required: [date, period]
      properties:
        date:
          type: string
          format: date
          description: Office time.
        period:
          type: string
          enum: [morning, afternoon, evening, any]

    AppointmentRequest:
      type: object
      required: [id, patient_id, provider_id, preferred, status, created_at]
      properties:
        id:
          type: string
          format: uuid
        patient_id:
          type: string
          format: uuid
        provider_id:
          type: string
          format: uuid
        preferred:
          type: array
          items:
            $ref: "#/components/schemas/PreferredTime"
        reason: { type: string }
        status:
          type: string
          enum: [pending, confirmed, declined, cancelled]
        appointment_id:
          type: string
          format: uuid
          nullable: true
          description: The booked visit, once confirmed.
        note:
          type: string
          description: The provider's note, on decline.
        created_at:
          type: string
          format: date-time
        decided_at:
          type: string
          format: date-time
          nullable: true

    CreateAppointmentRequest:
      type: object
      required: [patient_id, starts_at, ends_at]
      properties:
        provider_id:
          type: string
          format: uuid
          description: Required when the front desk or an admin books (#106); a provider always books for themself.
        patient_id:
          type: string
          format: uuid
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
        status:
          type: string
          enum: [scheduled, cancelled, completed, no_show]
          default: scheduled

    UpdateAppointmentRequest:
      type: object
      properties:
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
        status:
          type: string
          enum: [scheduled, cancelled, completed, no_show]

    AppointmentListResponse:
      type: object
      required: [appointments]
      properties:
        appointments:
          type: array
          items:
            $ref: "#/components/schemas/AppointmentView"

    PatientView:
      type: object
      required: [id, display_name, email, devices]
      properties:
        id: { type: string, format: uuid }
        display_name: { type: string }
        email: { type: string, format: email }
        link_status: { type: string, enum: [pending, active] }
        devices: { type: integer, description: Paired phones that are not revoked. }
        last_seen_at: { type: string, format: date-time }

    CreatePatientRequest:
      type: object
      required: [display_name, email]
      properties:
        display_name: { type: string, example: Jordan Lee }
        email: { type: string, format: email }

    CreateInviteRequest:
      type: object
      description: >
        The account to pair: user_id (any role) or, as before, patient_id.
        Patients: a provider linked to them, or an admin. Staff accounts:
        yourself, or anyone in the practice if you are an admin (#69).
      properties:
        user_id: { type: string, format: uuid }
        patient_id: { type: string, format: uuid }

    InviteResponse:
      type: object
      required: [id, patient_id, patient_name, expires_at, qr_payload, qr_png]
      properties:
        id: { type: string, format: uuid }
        patient_id: { type: string, format: uuid }
        patient_name: { type: string, description: The paired account's display name (any role). }
        role: { type: string, enum: [patient, provider, admin] }
        expires_at: { type: string, format: date-time, description: Redeem deadline (10 minutes). }
        qr_payload:
          type: string
          description: >
            The JSON in the QR code: v (1), relay, relay_pin, office, key_pin
            and the single-use invite code. Shown once; only its hash is stored.
        qr_png: { type: string, format: byte, description: Base64 PNG of the QR code. }

    InviteStatus:
      type: object
      required: [id, status]
      properties:
        id: { type: string, format: uuid }
        status:
          type: string
          enum: [issued, paired, expired]
        device_name: { type: string, description: Set once a phone has paired. }

    RedeemRequest:
      type: object
      required: [invite, public_key, timestamp, signature]
      properties:
        invite: { type: string }
        public_key: { type: string, format: byte, description: "Base64 DER SubjectPublicKeyInfo, P-256." }
        name: { type: string, maxLength: 100 }
        timestamp: { type: integer, format: int64 }
        signature:
          type: string
          format: byte
          description: DER ECDSA-SHA256 over "wehelp-device-v1\npair\n{invite}\n{timestamp}".

    RedeemResponse:
      allOf:
        - $ref: "#/components/schemas/EnrollResponse"
        - type: object
          required: [practice, patient_name]
          properties:
            practice: { type: string }
            patient_name: { type: string }
            role: { type: string, enum: [patient, provider, admin], description: The device's session role. }


    DeviceView:
      type: object
      required: [id, name, created_at, status]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, example: "Jordan's iPhone" }
        created_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time }
        revoked_at: { type: string, format: date-time }
        status: { type: string, enum: [active, revoked] }
        current: { type: boolean, description: True for the device making the request. }

    DeviceList:
      type: object
      required: [devices]
      properties:
        devices:
          type: array
          items:
            $ref: "#/components/schemas/DeviceView"

    StaffLoginRequest:
      type: object
      required: [tenant, email, password]
      properties:
        tenant: { type: string, example: Demo Clinic }
        email: { type: string, format: email }
        password: { type: string, format: password }
        code: { type: string, description: "TOTP code; omit only on the first sign-in, before TOTP is set up." }

    StaffMe:
      type: object
      required: [status, user_id, role, csrf_token]
      properties:
        status:
          type: string
          enum: [active, totp_setup]
          description: totp_setup means the session can only set up TOTP.
        user_id: { type: string, format: uuid }
        role: { type: string, enum: [provider, office, admin] }
        display_name: { type: string }
        practice: { type: string }
        csrf_token: { type: string, description: Send as X-CSRF-Token on every change. }

    TOTPSetup:
      type: object
      required: [secret, otpauth_url, qr_png]
      properties:
        secret: { type: string, description: "Base32, for manual entry." }
        otpauth_url: { type: string }
        qr_png: { type: string, format: byte }

    StaffSetupRequest:
      type: object
      required: [token, password]
      properties:
        token: { type: string, description: The token from the set-up link's URL fragment. }
        password: { type: string, minLength: 12, maxLength: 1024 }
    CreateProviderRequest:
      type: object
      required: [display_name, email]
      properties:
        role: { type: string, enum: [provider, office], default: provider, description: "office = front desk (#106)." }
        display_name: { type: string, maxLength: 200 }
        email: { type: string, format: email, description: Their sign-in name. }
    ProviderAccount:
      type: object
      required: [id, display_name, email, status, created_at]
      properties:
        id: { type: string, format: uuid }
        display_name: { type: string }
        email: { type: string }
        role: { type: string, enum: [provider, office] }
        status:
          type: string
          enum: [invited, invite_expired, totp_pending, active, disabled]
          description: >
            invited = a set-up link is open; invite_expired = it expired or
            was cancelled; totp_pending = password set, authenticator not yet;
            active = fully set up; disabled = cannot sign in.
        created_at: { type: string, format: date-time }
        disabled_at: { type: string, format: date-time }
        invite_expires_at: { type: string, format: date-time }
    Roster:
      type: object
      required: [installed, entries, need_action]
      properties:
        installed: { type: boolean, description: "The office is installed with the Registry, so the roster can be pulled." }
        synced_at: { type: string, format: date-time, nullable: true, description: Last successful pull. }
        attempted_at: { type: string, format: date-time, nullable: true }
        error: { type: string, description: Why the last pull failed; empty when it worked. }
        need_action: { type: integer, description: Invites to send plus accounts to disable. }
        result:
          type: object
          description: Only after Sync now.
          properties:
            added: { type: integer }
            removed: { type: integer }
            changed: { type: integer }
        entries:
          type: array
          items:
            type: object
            required: [registry_id, name, email, role, status]
            properties:
              registry_id: { type: string, format: uuid }
              name: { type: string }
              email: { type: string }
              role: { type: string, enum: [provider, admin] }
              credentials: { type: string }
              licence_number: { type: string }
              removed_at: { type: string, format: date-time, description: Removed in the Registry. }
              status:
                type: string
                enum: [needs_invite, add_admin, linked, disable, removed]
              account:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  role: { type: string }
                  status: { type: string, enum: [invited, invite_expired, totp_pending, active, disabled] }
                  disabled: { type: boolean }
    ProviderInvite:
      type: object
      required: [provider, setup_url, expires_at]
      properties:
        provider:
          $ref: "#/components/schemas/ProviderAccount"
        setup_url:
          type: string
          description: Shown once. The single-use token is in the URL fragment.
        expires_at: { type: string, format: date-time }

    ConversationView:
      type: object
      required: [user_id, name, role, link_status, last_from_me, unread_count]
      properties:
        user_id: { type: string, format: uuid }
        name: { type: string }
        role: { type: string, enum: [provider, patient, admin] }
        link_status: { type: string, enum: [pending, active] }
        last_body: { type: string }
        last_at: { type: string, format: date-time }
        last_from_me: { type: boolean }
        unread_count: { type: integer }

    SiteContent:
      type: object
      description: The practice website's content (#97). Practice information only, never patient data.
      properties:
        practice_name: { type: string, maxLength: 120 }
        tagline: { type: string, maxLength: 200 }
        about: { type: string, maxLength: 5000, description: "Paragraphs separated by blank lines." }
        hours: { type: string, maxLength: 500 }
        address: { type: string, maxLength: 300 }
        phone: { type: string, maxLength: 40 }
        email: { type: string, maxLength: 120 }
        app_url: { type: string, description: "App Store link; https only." }
        join: { type: string, maxLength: 2000, description: "Extra words for the Get the app page." }
        logo_file: { type: string, description: "Filename of an uploaded image." }
        theme:
          type: string
          enum: ["", sage, ocean, sunset, plum, clay, midnight]
          description: "The website colour scheme (#104); empty means sage."
        providers:
          type: array
          maxItems: 30
          items:
            type: object
            required: [name]
            properties:
              name: { type: string }
              credentials: { type: string }
              bio: { type: string }
              photo_file: { type: string }
        services:
          type: array
          maxItems: 50
          items:
            type: object
            required: [name]
            properties:
              name: { type: string }
              description: { type: string }
        podcasts:
          $ref: "#/components/schemas/PodcastList"

    PodcastList:
      type: array
      maxItems: 50
      items:
        type: object
        required: [title, url]
        properties:
          title: { type: string }
          url: { type: string, description: "https only." }
          description: { type: string }

    SiteFile:
      type: object
      required: [id, kind, title, filename, content_type, size, created_at]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [library, image] }
        title: { type: string }
        filename: { type: string, description: "Published as files/<filename>." }
        content_type: { type: string }
        size: { type: integer }
        created_at: { type: string, format: date-time }

    StaffProfile:
      type: object
      required: [display_name, credentials, bio, show_on_website, has_photo, role]
      properties:
        display_name: { type: string }
        credentials: { type: string }
        bio: { type: string }
        show_on_website: { type: boolean }
        has_photo: { type: boolean }
        role: { type: string, enum: [provider, office, admin] }
        updated_at: { type: string, format: date-time }
    StaffProfileUpdate:
      type: object
      required: [display_name]
      additionalProperties: false
      properties:
        display_name: { type: string, maxLength: 120 }
        credentials: { type: string, maxLength: 120 }
        bio: { type: string, maxLength: 3000 }
        show_on_website: { type: boolean }
    WebsiteProfile:
      type: object
      required: [name, credentials, has_photo]
      properties:
        name: { type: string }
        credentials: { type: string }
        has_photo: { type: boolean }

    PracticeType:
      type: object
      required: [id, label, clinical, words]
      properties:
        id: { type: string, enum: [naturopath, therapy, allied_health, salon] }
        label: { type: string }
        clinical: { type: boolean, description: "false hides check-ins and health monitors." }
        off:
          type: array
          items: { type: string }
          description: Features this type starts with turned off (#109).
        words:
          type: object
          required: [patient, patients, provider, providers]
          description: Lower case; for example client, clients, stylist, stylists.
          properties:
            patient: { type: string }
            patients: { type: string }
            provider: { type: string }
            providers: { type: string }
    PracticeView:
      type: object
      required: [type, types, features, switches]
      properties:
        type: { $ref: "#/components/schemas/PracticeType" }
        types:
          type: array
          items: { $ref: "#/components/schemas/PracticeType" }
        features:
          type: object
          additionalProperties: { type: boolean }
          description: "Effective switches (#109): the type's defaults with the admin's overrides."
        switches:
          type: array
          description: The switches, in Settings order.
          items:
            type: object
            required: [id, label]
            properties:
              id: { type: string }
              label: { type: string }

    MessageSettings:
      type: object
      required: [mode, days, start_minute, end_minute, auto_reply]
      additionalProperties: false
      properties:
        mode: { type: string, enum: ["on", hours, "off"] }
        days:
          type: array
          items: { type: integer, minimum: 0, maximum: 6 }
          description: 0 = Sunday, office time.
        start_minute: { type: integer, minimum: 0, maximum: 1439 }
        end_minute: { type: integer, minimum: 1, maximum: 1440 }
        auto_reply: { type: string, maxLength: 500, description: "Empty: a standard reply naming the hours." }

    PracticeMessage:
      type: object
      required: [id, patient_id, author_id, author_name, from_patient, body, created_at]
      properties:
        id: { type: string, format: uuid }
        patient_id: { type: string, format: uuid, description: Whose thread. }
        author_id: { type: string, format: uuid }
        author_name: { type: string, description: "The patient, or the staff member who answered for the practice." }
        from_patient: { type: boolean }
        body: { type: string }
        read_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
    InboxConversation:
      type: object
      required: [patient_id, patient_name, last_body, last_at, last_from_patient, unread]
      properties:
        patient_id: { type: string, format: uuid }
        patient_name: { type: string }
        last_body: { type: string }
        last_at: { type: string, format: date-time }
        last_from_patient: { type: boolean }
        unread: { type: integer, description: "From the patient, not yet read by the practice." }

    CareTeam:
      type: object
      required: [patient_id, patient_name, members]
      properties:
        patient_id: { type: string, format: uuid }
        patient_name: { type: string }
        members:
          type: array
          items:
            type: object
            required: [member_id, name, status, include_history, invited_by, created_at]
            properties:
              member_id: { type: string, format: uuid }
              name: { type: string }
              status: { type: string, enum: [pending, active, removed] }
              include_history: { type: boolean }
              invited_by: { type: string, description: Name of who added or proposed them. }
              created_at: { type: string, format: date-time }
              approved_at: { type: string, format: date-time }
              removed_at: { type: string, format: date-time }
        reads:
          type: array
          description: "Patient only: who opened the thread, newest first (last 100)."
          items:
            type: object
            properties:
              name: { type: string }
              at: { type: string, format: date-time }
        eligible:
          type: array
          description: Providers not on the team, who can be proposed or added (GET only).
          items:
            type: object
            properties:
              member_id: { type: string, format: uuid }
              name: { type: string }
    CareTeamSummary:
      type: object
      required: [patient_id, patient_name, my_status, active_members]
      properties:
        patient_id: { type: string, format: uuid }
        patient_name: { type: string }
        my_status: { type: string, enum: [active, pending, none] }
        active_members: { type: integer }
        last_message_at: { type: string, format: date-time }
    CareTeamMessage:
      type: object
      required: [id, author_id, author_name, from_patient, body, created_at]
      properties:
        id: { type: string, format: uuid }
        author_id: { type: string, format: uuid }
        author_name: { type: string }
        from_patient: { type: boolean }
        body: { type: string }
        created_at: { type: string, format: date-time }

    SitePost:
      type: object
      required: [id, title, body, image_file, author, draft, publish_at, status, updated_at]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        body: { type: string, description: "Plain text; paragraphs separated by blank lines." }
        image_file: { type: string, description: "An uploaded site image's filename, or empty." }
        author: { type: string }
        draft: { type: boolean }
        publish_at: { type: string, format: date-time }
        status: { type: string, enum: [draft, scheduled, live] }
        updated_at: { type: string, format: date-time }
    SitePostRequest:
      type: object
      required: [title, body]
      properties:
        title: { type: string, maxLength: 200 }
        body: { type: string, maxLength: 20000 }
        image_file: { type: string, maxLength: 100 }
        draft: { type: boolean, default: false }
        publish_at: { type: string, format: date-time, description: "When it goes live; default now." }

    SiteView:
      type: object
      required: [content, files, published_url]
      properties:
        content: { $ref: "#/components/schemas/SiteContent" }
        files:
          type: array
          items: { $ref: "#/components/schemas/SiteFile" }
        updated_at: { type: string, format: date-time, nullable: true }
        published_at: { type: string, format: date-time, nullable: true }
        published_url: { type: string }
        profiles:
          type: array
          description: Bios that come from staff profiles (#102); they replace a typed bio with the same name.
          items: { $ref: "#/components/schemas/WebsiteProfile" }
        themes:
          type: array
          description: The website themes to pick from (#104).
          items:
            type: object
            required: [id, label, swatch]
            properties:
              id: { type: string }
              label: { type: string }
              swatch: { type: string, description: "The accent colour, for the picker." }

    Product:
      type: object
      required: [id, sku, name, description, category, unit, price_cents, active, sort]
      properties:
        id: { type: string, format: uuid }
        sku: { type: string }
        name: { type: string }
        description: { type: string }
        category: { type: string }
        unit: { type: string, description: 'e.g. "60 capsules"' }
        price_cents: { type: integer }
        active: { type: boolean }
        sort: { type: integer }

    ProductRequest:
      type: object
      required: [sku, name, price_cents]
      properties:
        sku: { type: string, maxLength: 40 }
        name: { type: string, maxLength: 120 }
        description: { type: string, maxLength: 1000 }
        category: { type: string, maxLength: 60 }
        unit: { type: string, maxLength: 60 }
        price_cents: { type: integer, minimum: 0, maximum: 1000000 }
        active: { type: boolean, default: true }
        sort: { type: integer }

    Order:
      type: object
      required: [id, patient_id, status, note, staff_note, total_cents, items, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        patient_id: { type: string, format: uuid }
        patient_name: { type: string, description: "Staff on the office LAN only." }
        status: { type: string, enum: [placed, ready, fulfilled, cancelled] }
        note: { type: string, description: "The patient's." }
        staff_note: { type: string, description: "From the practice; shown to the patient." }
        total_cents: { type: integer }
        items:
          type: array
          items:
            type: object
            required: [product_id, name, unit, unit_price_cents, quantity]
            properties:
              product_id: { type: string, format: uuid }
              name: { type: string, description: "As it was when ordered." }
              unit: { type: string }
              unit_price_cents: { type: integer }
              quantity: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        closed_at: { type: string, format: date-time, nullable: true }

# ---------------------------------------------------------------------------
# Paths
# ---------------------------------------------------------------------------
paths:
  /healthz:
    get:
      tags: [health]
      summary: Process health check
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /readyz:
    get:
      tags: [health]
      summary: Database readiness check
      security: []
      responses:
        "200":
          description: DB reachable
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  relay:
                    type: string
                    enum: [connected, down, "off"]
                    description: |
                      The Relay tunnel, for wehelpd doctor (#81). "off" when
                      the office runs without a tunnel.
        "503":
          description: DB unreachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/ping:
    get:
      tags: [health]
      summary: Authenticated ping
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: pong

  # -------------------------------------------------------------------------
  # Auth
  # -------------------------------------------------------------------------
  /api/v1/auth/register:
    post:
      tags: [auth]
      summary: Register a new tenant + user
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Email already registered in this tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/auth/login:
    post:
      tags: [auth]
      summary: Log in with email + password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/auth/refresh:
    post:
      tags: [auth]
      summary: Rotate refresh token and get a new token pair
      description: |
        Refresh tokens are single-use: each refresh retires the token and
        returns a new one, so an app must run one refresh at a time.

        If the reply is lost, the app may send the old device-bound token
        again: while the token issued in its place is unused and live, the
        Back Office retires that unused token and returns a new pair
        (#136). Once the newer token has been used, the old one gets
        `invalid_token`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "401":
          description: >
            Invalid or expired refresh token, a failed device proof, a revoked
            device, or a patient token that is not device-bound. `code` says
            which; see the Error schema.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/auth/enroll:
    post:
      tags: [auth]
      summary: Enroll this device and get a device-bound token pair
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnrollRequest"
      responses:
        "201":
          description: Device enrolled; the login refresh token is consumed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnrollResponse"
        "400":
          description: Malformed body or a public key that is not P-256 SPKI.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Invalid refresh token or failed device proof.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Session already device-bound, or the key is already enrolled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/auth/logout:
    post:
      tags: [auth]
      summary: Revoke a session (and its device, if device-bound)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LogoutRequest"
      responses:
        "204":
          description: >
            Revoked. For a device-bound token, the device and all its tokens
            are revoked. Unknown or expired tokens also return 204.
        "400":
          description: Malformed body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # -------------------------------------------------------------------------
  # Me
  # -------------------------------------------------------------------------
  /api/v1/me:
    get:
      tags: [me]
      summary: Return the authenticated identity
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # -------------------------------------------------------------------------
  # Links
  # -------------------------------------------------------------------------
  /api/v1/links:
    post:
      tags: [links]
      summary: Invite a patient by email (provider only)
      description: Creates a pending provider-patient link.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLinkRequest"
      responses:
        "201":
          description: Link created (pending)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LinkView"
        "400":
          description: Invalid request or user is not a patient
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Only providers can invite patients
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No patient with that email in this tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Link already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    get:
      tags: [links]
      summary: List the caller's links (provider or patient side)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LinkView"
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/links/{userID}/accept:
    post:
      tags: [links]
      summary: Accept a pending invite (patient only)
      description: "`{userID}` is the provider's user ID."
      parameters:
        - name: userID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Link activated
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: active
        "403":
          description: Only patients can accept invites
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No pending invite from that provider
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/links/{userID}/revoke:
    post:
      tags: [links]
      summary: Revoke a pending or active link (either party)
      description: "`{userID}` is the other party's user ID."
      parameters:
        - name: userID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Link revoked
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: revoked
        "404":
          description: No link with that user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/links/{userID}/checkin:
    put:
      tags: [links]
      summary: Set a patient's check-in reminder cadence (provider only)
      description: |
        `{userID}` is the patient. The Back Office's reminder worker sends a
        kind=reminder message every `every_days` days, counted from now,
        during the day in the office's time zone, unless the patient already
        checked in during the last period. `null` turns it off.
      parameters:
        - name: userID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [every_days]
              properties:
                every_days:
                  type: integer
                  minimum: 1
                  maximum: 90
                  nullable: true
      responses:
        "200":
          description: Cadence set
          content:
            application/json:
              schema:
                type: object
                properties:
                  every_days:
                    type: integer
                    nullable: true
        "400":
          description: every_days out of range
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Caller is not a provider
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No active link with that patient
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # -------------------------------------------------------------------------
  # Messages
  # -------------------------------------------------------------------------
  /api/v1/messages:
    post:
      tags: [messages]
      summary: Send a message
      description: |
        Requires an active provider-patient link (either direction) with
        the recipient. Kind defaults to `message` if omitted. Patients may
        send only `message` and `checkin`; `memo` and `reminder` are for
        staff. Metadata must be a JSON object (or omitted/null for `{}`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMessageRequest"
      responses:
        "201":
          description: Message sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  kind:
                    type: string
        "400":
          description: Invalid request (bad kind, empty body, self-message, bad metadata)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: No active link with that user, or a patient sending a staff kind (memo, reminder)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    get:
      tags: [messages]
      summary: List the caller's inbox, or one conversation with ?with= (newest first, keyset-paginated)
      parameters:
        - $ref: "#/components/parameters/Unread"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: with
          in: query
          required: false
          schema: { type: string, format: uuid }
          description: >
            A linked user's ID: return the whole thread with them, both
            directions (#67). Unread is ignored. 404 if not linked. Each
            thread read is audited.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageListResponse"
        "400":
          description: Invalid limit, cursor or with
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No conversation with that user (not linked)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/conversations:
    get:
      tags: [messages]
      summary: Everyone you're linked with, with the latest message and unread count (#67)
      responses:
        "200":
          description: Conversations with messages first, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [conversations]
                properties:
                  conversations:
                    type: array
                    items:
                      $ref: "#/components/schemas/ConversationView"

  /api/v1/messages/{messageID}/read:
    post:
      tags: [messages]
      summary: Mark a message as read (recipient only, idempotent)
      parameters:
        - name: messageID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Marked read or already read
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [read, "already read"]
        "404":
          description: Message not found or not addressed to caller
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # -------------------------------------------------------------------------
  # Appointments (M2 — planned, not yet implemented)
  # -------------------------------------------------------------------------
  /api/v1/appointments:
    post:
      tags: [appointments]
      summary: Create an appointment (staff)
      description: |
        A provider books their own schedule; the front desk (office) and
        admins book for the provider named in provider_id (#106).
        A provider needs an active link with the patient. A front-desk or
        admin booking makes that link if there is none (or activates a
        pending invite), audited as link.create; a revoked link is refused
        with 409. The provider cannot double-book: overlapping appointments
        are rejected with 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAppointmentRequest"
      responses:
        "201":
          description: Appointment created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppointmentView"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Not a provider or no active link with patient
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Overlapping appointment exists, or the link was revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    get:
      tags: [appointments]
      summary: List appointments scoped to the caller
      description: |
        Providers see their appointments; patients see appointments where
        they are the patient. Optional `from`/`to` bounds on `starts_at`.
      parameters:
        - $ref: "#/components/parameters/FromParam"
        - $ref: "#/components/parameters/ToParam"
        - name: provider_id
          in: query
          required: false
          schema: { type: string, format: uuid }
          description: Front desk and admins only (#106), who otherwise see the whole practice.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppointmentListResponse"

  /api/v1/appointments/{appointmentID}:
    patch:
      tags: [appointments]
      summary: Update an appointment (reschedule and/or status transition)
      description: |
        Provider can reschedule (new `starts_at`/`ends_at`) and/or change
        status (`scheduled` → `cancelled` | `completed` | `no_show`).
        Rescheduling re-checks for overlaps.
      parameters:
        - name: appointmentID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAppointmentRequest"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppointmentView"
        "403":
          description: Not the provider
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Appointment not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Reschedule would overlap an existing appointment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # Video visits (#6). Participants only, from the app (device sessions),
  # through the Relay. Media is phone to phone through the Relay's TURN.
  /api/v1/appointments/{appointmentID}/visit/start:
    post:
      tags: [visits]
      summary: The provider starts (or rejoins) the video visit
      description: |
        Only the appointment's provider, from the app, while the appointment
        is scheduled and inside the join window (10 minutes before the start
        until 30 minutes after the end). Opens the visit, joins this device
        (replacing any other device of theirs) and pushes `visit_starting` to
        the patient. Audited as visit.open and visit.join.
      parameters:
        - { name: appointmentID, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: "In the call", content: { application/json: { schema: { $ref: "#/components/schemas/VisitJoin" } } } }
        "403": { description: "Not the provider, a browser session, or another role", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "404": { description: "No such appointment of yours", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "409": { description: "Codes: not_scheduled, outside_window, ended; or video is turned off for the practice", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "503": { description: "Code video_unavailable: no TURN key from the Relay (the tunnel is down). Code video_busy: the office already has as many live visits as its Relay allows (#175); Retry-After is set. The visit isn't marked failed.", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /api/v1/appointments/{appointmentID}/visit/join:
    post:
      tags: [visits]
      summary: The patient joins an open visit, or the provider rejoins
      description: |
        Like start, but the provider must have started the visit first
        (409 `not_started` until then). Joining from another device replaces
        the earlier one, which gets `replaced`. Audited as visit.join.
      parameters:
        - { name: appointmentID, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: "In the call", content: { application/json: { schema: { $ref: "#/components/schemas/VisitJoin" } } } }
        "403": { description: "A browser session or another role", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "404": { description: "No such appointment of yours", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "409": { description: "Codes: not_started, not_scheduled, outside_window, ended; or video is turned off", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "503": { description: "Codes: video_unavailable; video_busy (the office is at its live visit cap, #175; Retry-After is set)", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /api/v1/visits/{visitID}/signals:
    get:
      tags: [visits]
      summary: Long-poll for signals from the other side
      description: |
        Returns at once with any signals after `after`, otherwise waits up to
        15 seconds, so clients need a request timeout of at least 20 seconds.
        Only while the call screen is open: the one exception to
        the polling rules in docs/MOBILE_CLIENT.md. Signals are held in
        memory only and never stored or logged.
      parameters:
        - { name: visitID, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: after, in: query, required: false, schema: { type: integer } }
      responses:
        "200":
          description: Signals (possibly none), and whether the visit has ended
          content:
            application/json:
              schema:
                type: object
                required: [signals, ended]
                properties:
                  signals: { type: array, items: { $ref: "#/components/schemas/VisitSignal" } }
                  ended: { type: boolean }
        "404": { description: "No such visit of yours", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "409": { description: "Codes: replaced (moved to another of your devices), not_in_call (join first)", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    post:
      tags: [visits]
      summary: Send a signal to the other side
      description: The provider sends offers and the patient answers; both send ICE candidates. The patient may send restart to ask for a fresh offer.
      parameters:
        - { name: visitID, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type]
              properties:
                type: { type: string, enum: [offer, answer, candidate, restart] }
                sdp: { type: string, description: "offer and answer; at most 16 KB" }
                candidate: { type: object, additionalProperties: true, description: "RTCIceCandidate fields; at most 2 KB" }
      responses:
        "204": { description: Passed on }
        "400": { description: "Wrong type for your role, or bad SDP or candidate", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "404": { description: "No such visit of yours", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "409": { description: "Codes: ended, replaced, not_in_call", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /api/v1/visits/{visitID}/leave:
    post:
      tags: [visits]
      summary: Leave the call; the visit stays open to rejoin
      description: Audited as visit.leave. The other side gets `left`.
      parameters:
        - { name: visitID, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Left }
        "404": { description: "No such visit of yours", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /api/v1/visits/{visitID}/end:
    post:
      tags: [visits]
      summary: The provider ends the visit for both
      description: |
        Audited as visit.end. The appointment is left as it is for staff to
        mark. A visit nobody ends closes itself at the end of its window.
      parameters:
        - { name: visitID, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Ended }
        "403": { description: "Not the provider", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "404": { description: "No such visit of yours", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  # Appointment requests (#68)
  /api/v1/appointment-requests:
    post:
      tags: [appointments]
      summary: Ask a linked provider for an appointment (patient only)
      description: |
        1-3 preferred days (office time, today to 180 days out) with a time
        of day each. At most 3 requests may wait per provider. The
        provider's devices get the generic `appointment_request` push.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider_id, preferred]
              properties:
                provider_id:
                  type: string
                  format: uuid
                preferred:
                  type: array
                  minItems: 1
                  maxItems: 3
                  items:
                    $ref: "#/components/schemas/PreferredTime"
                reason:
                  type: string
                  maxLength: 500
      responses:
        "201":
          description: Request sent (pending)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppointmentRequest"
        "400":
          description: Invalid preferred times or reason
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Not a patient, or no active link with that provider
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Already 3 requests waiting for this provider
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    get:
      tags: [appointments]
      summary: List the caller's requests (a patient's own, or those to a provider)
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, confirmed, declined, cancelled]
      responses:
        "200":
          description: Newest first, at most 100
          content:
            application/json:
              schema:
                type: object
                properties:
                  requests:
                    type: array
                    items:
                      $ref: "#/components/schemas/AppointmentRequest"

  /api/v1/appointment-requests/{requestID}/cancel:
    post:
      tags: [appointments]
      summary: Withdraw a pending request (the patient who made it)
      parameters:
        - $ref: "#/components/parameters/RequestID"
      responses:
        "200":
          description: Cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppointmentRequest"
        "403":
          description: Not a patient
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No such request of the caller's
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: No longer pending
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/appointment-requests/{requestID}/confirm:
    post:
      tags: [appointments]
      summary: Confirm a request by booking the visit (the provider asked)
      description: |
        Books a scheduled appointment at the given time (the usual overlap
        rules apply), leaves a message in the patient's thread and sends
        them the generic `appointment_update` push.
      parameters:
        - $ref: "#/components/parameters/RequestID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [starts_at, ends_at]
              properties:
                starts_at:
                  type: string
                  format: date-time
                ends_at:
                  type: string
                  format: date-time
      responses:
        "200":
          description: Confirmed; appointment_id is the booked visit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppointmentRequest"
        "400":
          description: Time in the past, or ends before it starts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Not a provider, or the link is no longer active
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No such request addressed to the caller
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: No longer pending, or the time overlaps another visit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/appointment-requests/{requestID}/decline:
    post:
      tags: [appointments]
      summary: Decline a request, with an optional note to the patient
      parameters:
        - $ref: "#/components/parameters/RequestID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                note:
                  type: string
                  maxLength: 500
      responses:
        "200":
          description: Declined
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppointmentRequest"
        "403":
          description: Not a provider
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No such request addressed to the caller
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: No longer pending
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/patients:
    get:
      tags: [pairing]
      summary: List your patients and their paired phones (staff)
      responses:
        "200":
          description: Patients.
          content:
            application/json:
              schema:
                type: object
                required: [patients]
                properties:
                  patients:
                    type: array
                    items:
                      $ref: "#/components/schemas/PatientView"
        "403":
          description: Not staff.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      tags: [pairing]
      summary: Add a patient with no password (staff, office LAN only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePatientRequest"
      responses:
        "201":
          description: Created; a provider is linked to the new patient.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatientView"
        "400":
          description: Missing name or email.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Not staff, or the request came through the Relay.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Email already used in this practice.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/pairing/invites:
    post:
      tags: [pairing]
      summary: Issue a QR pairing invite for one patient (staff, office LAN only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInviteRequest"
      responses:
        "201":
          description: Invite issued; show the QR code.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InviteResponse"
        "403":
          description: Not staff, or the request came through the Relay.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No such patient for this staff member.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: The office is not installed with the Registry yet.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/pairing/invites/{inviteID}:
    get:
      tags: [pairing]
      summary: Whether an invite has been used (staff, office LAN only)
      parameters:
        - { name: inviteID, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InviteStatus"
        "403":
          description: Not staff, or the request came through the Relay.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/pairing/redeem:
    post:
      tags: [pairing]
      summary: Redeem a scanned invite; enrolls this phone and signs it in
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RedeemRequest"
      responses:
        "200":
          description: Paired; the device-bound session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RedeemResponse"
        "400":
          description: Malformed body or key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Invalid or expired invite, or a failed device proof.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: This key is already enrolled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/devices:
    get:
      tags: [devices]
      summary: List your own devices
      responses:
        "200":
          description: Devices, active first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceList"
        "401":
          description: Not signed in, or this device was revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/devices/{deviceID}:
    delete:
      tags: [devices]
      summary: Revoke one of your own devices
      description: >
        Revokes the device and all its refresh tokens; its access tokens stop
        working at once. Revoking the current device signs it out. Revoking an
        already revoked device succeeds.
      parameters:
        - { name: deviceID, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204":
          description: Revoked.
        "404":
          description: Not one of your devices.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/patients/{patientID}/devices:
    get:
      tags: [devices]
      summary: List a patient's devices (staff, office LAN only)
      parameters:
        - { name: patientID, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Devices, active first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceList"
        "403":
          description: Not staff, or the request came through the Relay.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No such patient for this staff member.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/patients/{patientID}/devices/{deviceID}:
    delete:
      tags: [devices]
      summary: Revoke a patient's device (staff, office LAN only)
      parameters:
        - { name: patientID, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: deviceID, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204":
          description: Revoked; the device is locked out at once.
        "403":
          description: Not staff, or the request came through the Relay.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No such patient for this staff member, or not that patient's device.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/staff/login:
    post:
      tags: [staff]
      summary: Staff sign-in with password + TOTP (office LAN only)
      description: >
        Sets the session cookie. Without TOTP set up yet, returns status
        totp_setup and a session that can only set it up. Five failures lock
        the account for 15 minutes. Through the Relay this route is a 404.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StaffLoginRequest"
      responses:
        "200":
          description: Signed in (or ready for TOTP setup).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffMe"
        "401":
          description: Invalid credentials, code or locked account (one answer for all).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Through the Relay.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/staff/totp/setup:
    post:
      tags: [staff]
      summary: Create a TOTP secret (setup session only)
      security: [{ staffCookie: [] }]
      responses:
        "200":
          description: Scan the QR code with an authenticator app.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TOTPSetup"
        "401":
          description: No setup session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Missing or invalid CSRF token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/staff/totp/confirm:
    post:
      tags: [staff]
      summary: Turn TOTP on with a code; replaces the setup session with a full one
      security: [{ staffCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string }
      responses:
        "200":
          description: TOTP on; signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffMe"
        "401":
          description: Wrong code, or no setup session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Missing or invalid CSRF token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Setup not started.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/staff/me:
    get:
      tags: [staff]
      summary: The signed-in staff member and the CSRF token
      security: [{ staffCookie: [] }]
      responses:
        "200":
          description: Signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffMe"
        "401":
          description: Not signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/staff/logout:
    post:
      tags: [staff]
      summary: End the staff session
      security: [{ staffCookie: [] }]
      responses:
        "204":
          description: Signed out; the cookie is cleared.
        "403":
          description: Missing or invalid CSRF token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/staff/setup:
    post:
      tags: [staff]
      summary: Redeem a set-up link; set a password and start TOTP setup (#100)
      description: >
        The token comes from the set-up link an admin made (its URL
        fragment). It works once, for 24 hours, on the office LAN. Sets a
        session cookie that can only set up TOTP, as at a first sign-in.
        Through the Relay this route is a 404.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StaffSetupRequest"
      responses:
        "200":
          description: Password set; status totp_setup.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffMe"
        "400":
          description: Password too short, or the link is invalid, used, replaced or expired (one answer for all).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Through the Relay.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/staff/providers:
    get:
      tags: [staff]
      summary: The practice's provider accounts (admins only, #100)
      security: [{ staffCookie: [] }, { bearerAuth: [] }]
      responses:
        "200":
          description: Provider accounts.
          content:
            application/json:
              schema:
                type: object
                required: [providers]
                properties:
                  providers:
                    type: array
                    items:
                      $ref: "#/components/schemas/ProviderAccount"
        "401":
          description: Not signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Not an admin, or a missing CSRF token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Through the Relay.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      tags: [staff]
      summary: Add a provider and get a single-use set-up link (admins only, #100)
      description: >
        Creates a provider account with no password. The set-up link is
        returned only here; only its hash is stored. The provider sets their
        own password and enrolls TOTP from it. Audited as staff.invite.
      security: [{ staffCookie: [] }, { bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProviderRequest"
      responses:
        "201":
          description: Provider added.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderInvite"
        "400":
          description: Missing name or invalid email.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Not signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Not an admin, or a missing CSRF token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Through the Relay.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: That email already has an account in this practice.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/staff/providers/{userID}/invite:
    post:
      tags: [staff]
      summary: Replace a provider's set-up link (admins only, #100)
      description: >
        For a link that expired or was lost. Cancels the old link. Only for
        an account that hasn't set a password. Audited as staff.invite.
      security: [{ staffCookie: [] }, { bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/ProviderUserID"
      responses:
        "200":
          description: New link.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderInvite"
        "403":
          description: Not an admin, or a missing CSRF token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No such provider in this practice, or through the Relay.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Already set up, or disabled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/staff/providers/{userID}/disable:
    post:
      tags: [staff]
      summary: Disable a provider account (admins only, #100)
      description: >
        Ends their staff web sessions, revokes refresh tokens and cancels
        open set-up links; sign-in and API calls are refused until enabled.
        Nothing is deleted and paired devices stay paired. Audited as
        staff.disable.
      security: [{ staffCookie: [] }, { bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/ProviderUserID"
      responses:
        "200":
          description: Disabled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderAccount"
        "403":
          description: Not an admin, or a missing CSRF token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No such provider in this practice, or through the Relay.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Already disabled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/staff/providers/{userID}/enable:
    post:
      tags: [staff]
      summary: Enable a disabled provider account (admins only, #100)
      description: Audited as staff.enable. A provider who never set up their account needs a new set-up link.
      security: [{ staffCookie: [] }, { bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/ProviderUserID"
      responses:
        "200":
          description: Enabled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderAccount"
        "403":
          description: Not an admin, or a missing CSRF token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No such provider in this practice, or through the Relay.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Not disabled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/staff/roster:
    get:
      tags: [staff]
      summary: The provider roster from the Registry (admins only, #62)
      description: >
        The practice's providers and admins as last pulled from the Registry,
        each with the matching staff account (same email) if there is one.
        A provider removed in the Registry whose account still works has
        status `disable`: the admin disables it; nothing is disabled or
        deleted automatically. LAN only.
      security: [{ staffCookie: [] }, { bearerAuth: [] }]
      responses:
        "200":
          description: The roster.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Roster"
        "403":
          description: Not an admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Through the Relay.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/staff/roster/sync:
    post:
      tags: [staff]
      summary: Pull the roster from the Registry now (admins only, #62)
      description: >
        The Back Office also pulls it every `roster_interval` (15 minutes by
        default). The request is signed with the office key; the answer is
        checked against the Registry key pinned at install. Audited as
        roster.sync.
      security: [{ staffCookie: [] }, { bearerAuth: [] }]
      responses:
        "200":
          description: The roster after the pull, with what changed in `result`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Roster"
        "403":
          description: Not an admin, or a missing CSRF token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Through the Relay.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The office isn't installed with the Registry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: The Registry couldn't be reached or its answer didn't verify.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/staff/roster/{registryID}/invite:
    post:
      tags: [staff]
      summary: Invite a roster provider (admins only, #62)
      description: >
        Creates the provider's account with no password and returns a
        single-use set-up link, exactly as adding staff does (#100). Audited
        as staff.invite with via roster. Admins on the roster are added on
        the Back Office host with `wehelpd staff add`.
      security: [{ staffCookie: [] }, { bearerAuth: [] }]
      parameters:
        - name: registryID
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The roster entry's Registry ID.
      responses:
        "201":
          description: Account created; the link is shown once.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderInvite"
        "403":
          description: Not an admin, or a missing CSRF token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not on this practice's roster, or through the Relay.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Removed in the Registry, an admin, or the email already has an account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/staff/audit/verify:
    get:
      tags: [staff]
      summary: Check the practice's audit hash chain (admins only, #24)
      description: >
        Recomputes the admin's own practice's audit chain and reports the first
        broken event. Events from before #28 can only be checked by their links
        (`link_only`). The check is itself recorded as audit.verify. LAN only.
        On the host, `wehelpd audit verify` checks every practice.
      security: [{ staffCookie: [] }, { bearerAuth: [] }]
      responses:
        "200":
          description: The result; a broken chain is still a 200, with ok false.
          content:
            application/json:
              schema:
                type: object
                required: [ok, verified, link_only, forked]
                properties:
                  ok: { type: boolean }
                  verified: { type: integer, description: "Events checked." }
                  broken_at: { type: integer, description: "Sequence number of the first bad event; absent when ok." }
                  link_only: { type: integer, description: "Pre-#28 events checked by link only." }
                  forked: { type: integer, description: "Pre-#28 events written at the same moment as another, linked to the same parent (the old head lock allowed it)." }
        "403":
          description: Not an admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Through the Relay.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/staff/backups:
    get:
      tags: [staff]
      summary: Recent backup runs and any warning (admins only, #41)
      description: >
        Runs recorded by deploy/backup.sh. `warning` is set when no backup has
        run, the last one failed, or the last good one is more than 36 hours
        old; the staff web shows it to admins. Sizes and checksums only. LAN only.
      security: [{ staffCookie: [] }, { bearerAuth: [] }]
      responses:
        "200":
          description: Status.
          content:
            application/json:
              schema:
                type: object
                required: [warning, runs]
                properties:
                  last_ok_at: { type: string, format: date-time, nullable: true }
                  warning: { type: string, description: "Empty when all is well." }
                  runs:
                    type: array
                    items:
                      type: object
                      properties:
                        started_at: { type: string, format: date-time }
                        finished_at: { type: string, format: date-time }
                        ok: { type: boolean }
                        bytes: { type: integer }
                        copied_to: { type: string }
                        error: { type: string }
        "403":
          description: Not an admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Through the Relay.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/staff/profile:
    get:
      tags: [staff]
      summary: Your own profile, used for the website bio (#102)
      security: [{ staffCookie: [] }, { bearerAuth: [] }]
      responses:
        "200":
          description: The signed-in staff member's profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffProfile"
        "401":
          description: Not signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Through the Relay.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    put:
      tags: [staff]
      summary: Save your own profile (#102)
      description: >
        Name as shown (also the account's display name), credentials, bio and
        whether the practice website shows you. The next website publish uses
        it. Audited as staff.profile_update.
      security: [{ staffCookie: [] }, { bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StaffProfileUpdate"
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffProfile"
        "400":
          description: Missing name, a field too long, or an unknown field.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Missing or invalid CSRF token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Through the Relay.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/staff/profile/photo:
    get:
      tags: [staff]
      summary: Your own photo, for the preview (#102)
      security: [{ staffCookie: [] }, { bearerAuth: [] }]
      responses:
        "200":
          description: The image.
          content:
            image/png: { schema: { type: string, format: binary } }
            image/jpeg: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
        "404":
          description: No photo, or through the Relay.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    put:
      tags: [staff]
      summary: Replace your own photo (#102)
      description: >
        The body is the image: PNG, JPEG or WebP, at most 2 MB, checked by
        its content. Audited as staff.profile_update.
      security: [{ staffCookie: [] }, { bearerAuth: [] }]
      requestBody:
        required: true
        content:
          image/png: { schema: { type: string, format: binary } }
          image/jpeg: { schema: { type: string, format: binary } }
          image/webp: { schema: { type: string, format: binary } }
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffProfile"
        "400":
          description: Not a PNG, JPEG or WebP image, or over 2 MB.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Missing or invalid CSRF token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Through the Relay.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      tags: [staff]
      summary: Remove your own photo (#102)
      security: [{ staffCookie: [] }, { bearerAuth: [] }]
      responses:
        "200":
          description: Removed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffProfile"
        "403":
          description: Missing or invalid CSRF token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Through the Relay.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/practice:
    get:
      tags: [practice]
      summary: The practice type and its words (#108)
      description: >
        Any signed-in user, including the app through the Relay: it holds no
        patient data. The words are what this practice calls the people it
        serves and its staff; the API itself always says patient and provider.
      responses:
        "200":
          description: The practice type, and the types to choose from.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PracticeView"
        "401":
          description: Not signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    put:
      tags: [practice]
      summary: Set the practice type (admins, office LAN only, #108)
      description: Audited as practice.update. The website uses the new words at its next publish.
      security: [{ staffCookie: [] }, { bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type]
              additionalProperties: false
              properties:
                type: { type: string, enum: [naturopath, therapy, allied_health, salon] }
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PracticeView"
        "400":
          description: Unknown practice type.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Not an admin, or a missing CSRF token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Through the Relay.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/practice/features:
    put:
      tags: [practice]
      summary: Turn practice features on or off (admins, office LAN only, #109)
      description: >
        Only the switches sent change. A switched-off feature is hidden in the
        staff web and the app, and the server refuses it with 409. Audited as
        practice.features. Check-ins stay off for a practice type that isn't
        clinical.
      security: [{ staffCookie: [] }, { bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [features]
              additionalProperties: false
              properties:
                features:
                  type: object
                  additionalProperties: { type: boolean }
                  description: "Feature id to on (true) or off (false): messages, requests, reminders, checkins, video, store, library, website."
      responses:
        "200":
          description: Saved; the effective switches.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PracticeView"
        "400":
          description: Unknown feature, or nothing sent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Not an admin, or a missing CSRF token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Through the Relay.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/staff/profile/messages:
    get:
      tags: [staff]
      summary: Your own message mode (#109)
      security: [{ staffCookie: [] }, { bearerAuth: [] }]
      responses:
        "200":
          description: The settings (defaults if never set).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageSettings"
        "404":
          description: Through the Relay.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    put:
      tags: [staff]
      summary: Set how you take messages from patients (#109)
      description: >
        on: as usual. hours: messages arrive any time; outside the hours (office
        time) the patient gets the automatic reply, at most once every 12 hours,
        and you get no notification. off: patients can't message you (409).
        Audited as staff.message_settings.
      security: [{ staffCookie: [] }, { bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageSettings"
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageSettings"
        "400":
          description: Bad mode, days or hours, or the reply is too long.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Missing or invalid CSRF token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Through the Relay.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/practice-inbox:
    get:
      tags: [practice]
      summary: The practice inbox (#110)
      description: >
        A patient gets their own thread with the practice (any channel). The
        front desk (office) and admins get the list of conversations, newest
        first, on the office LAN only. Providers get 403. 409 when the
        practice has messages off.
      responses:
        "200":
          description: "Patient: {messages}. Front desk: {conversations}."
          content:
            application/json:
              schema:
                type: object
                properties:
                  messages:
                    type: array
                    items: { $ref: "#/components/schemas/PracticeMessage" }
                  conversations:
                    type: array
                    items: { $ref: "#/components/schemas/InboxConversation" }
        "403":
          description: Providers.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Front desk through the Relay.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Messages are off for this practice.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      tags: [practice]
      summary: Write to the practice, or reply as the practice (#110)
      description: >
        A patient writes in their own thread. The front desk or an admin
        replies in a patient's thread (patient_id required, LAN only), signed
        with their name. Audited as practice_message.create. Pushes are generic.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                patient_id: { type: string, format: uuid, description: Front desk only. }
                body: { type: string, maxLength: 4000 }
      responses:
        "201":
          description: Sent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PracticeMessage"
        "400":
          description: Empty or too long, or patient_id missing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Providers.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No such patient, or the front desk through the Relay.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Messages are off for this practice.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/practice-inbox/{patientID}:
    get:
      tags: [practice]
      summary: One patient's thread with the practice (#110)
      description: The front desk and admins (LAN), or the patient for their own.
      parameters:
        - name: patientID
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The thread, oldest first.
          content:
            application/json:
              schema:
                type: object
                required: [messages]
                properties:
                  messages:
                    type: array
                    items: { $ref: "#/components/schemas/PracticeMessage" }
        "403":
          description: Providers.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Another patient's thread, or the front desk through the Relay.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/practice-inbox/read:
    post:
      tags: [practice]
      summary: Mark the other side's messages read (#110)
      description: A patient marks the practice's replies read; the front desk marks a patient's messages read (patient_id required).
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                patient_id: { type: string, format: uuid }
      responses:
        "200":
          description: How many were marked.
          content:
            application/json:
              schema:
                type: object
                properties:
                  marked: { type: integer }
        "400":
          description: patient_id missing (front desk).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Providers.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/care-teams:
    get:
      tags: [care-teams]
      summary: Your care teams (#111)
      description: >
        A provider gets the teams they are on or invited to, and their linked
        patients they could join (my_status none). A patient gets their own
        team, with who has read the thread. The front desk and admins get 403.
        409 when care teams or messages are off for the practice.
      responses:
        "200":
          description: "Provider: {teams}. Patient: a CareTeam."
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/CareTeam"
                  - type: object
                    required: [teams]
                    properties:
                      teams:
                        type: array
                        items: { $ref: "#/components/schemas/CareTeamSummary" }
        "403":
          description: Not a provider or patient.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Care teams or messages are off.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/care-teams/{patientID}:
    get:
      tags: [care-teams]
      summary: A patient's care team (#111)
      description: The patient, a member, an invited provider, or a provider with an active link. The patient also gets the read log.
      parameters:
        - $ref: "#/components/parameters/TeamPatientID"
      responses:
        "200":
          description: The team.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CareTeam"
        "404":
          description: No access.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Care teams or messages are off.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/care-teams/{patientID}/members:
    post:
      tags: [care-teams]
      summary: Add or propose a provider (#111)
      description: >
        The patient adds a provider at once (care_team.add). A member or a
        linked provider proposes one, who waits for the patient's approval
        (care_team.propose). include_history lets them see messages from
        before they joined.
      parameters:
        - $ref: "#/components/parameters/TeamPatientID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [member_id]
              properties:
                member_id: { type: string, format: uuid }
                include_history: { type: boolean, default: false }
      responses:
        "201":
          description: Added or proposed; the team.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CareTeam"
        "400":
          description: Not a provider of this practice.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No access.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Already on the team or waiting, or care teams are off.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/care-teams/{patientID}/members/{memberID}/approve:
    post:
      tags: [care-teams]
      summary: The patient approves a proposed provider (#111)
      parameters:
        - $ref: "#/components/parameters/TeamPatientID"
        - $ref: "#/components/parameters/TeamMemberID"
      responses:
        "200":
          description: Approved; the team.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CareTeam"
        "404":
          description: Not the patient, or no such pending member.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/care-teams/{patientID}/members/{memberID}/decline:
    post:
      tags: [care-teams]
      summary: The patient declines a proposed provider (#111)
      parameters:
        - $ref: "#/components/parameters/TeamPatientID"
        - $ref: "#/components/parameters/TeamMemberID"
      responses:
        "200":
          description: Declined; the team.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CareTeam"
        "404":
          description: Not the patient, or no such pending member.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/care-teams/{patientID}/members/{memberID}:
    delete:
      tags: [care-teams]
      summary: Remove a member, or leave (#111)
      description: The patient removes anyone; a member can only remove themselves. A removed member sees nothing of the thread, past or future.
      parameters:
        - $ref: "#/components/parameters/TeamPatientID"
        - $ref: "#/components/parameters/TeamMemberID"
      responses:
        "200":
          description: Removed; the team.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CareTeam"
        "403":
          description: A member removing someone else.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No access, or no such member.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/care-teams/{patientID}/messages:
    get:
      tags: [care-teams]
      summary: The shared thread (#111)
      description: >
        The patient or an active member, oldest first. A member sees messages
        from before they joined only with include_history. Each member's read
        is audited as care_team.read and shown to the patient.
      parameters:
        - $ref: "#/components/parameters/TeamPatientID"
      responses:
        "200":
          description: The thread.
          content:
            application/json:
              schema:
                type: object
                required: [messages]
                properties:
                  messages:
                    type: array
                    items: { $ref: "#/components/schemas/CareTeamMessage" }
        "404":
          description: Not the patient or an active member.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Care teams or messages are off.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      tags: [care-teams]
      summary: Write to the shared thread (#111)
      description: The patient or an active member. Audited as care_team_message.create; everyone else on the team gets a generic push.
      parameters:
        - $ref: "#/components/parameters/TeamPatientID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string, maxLength: 4000 }
      responses:
        "201":
          description: Sent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CareTeamMessage"
        "400":
          description: Empty or too long.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not the patient or an active member.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/site/posts:
    get:
      tags: [site]
      summary: Blog posts, newest first (staff, office LAN only, #121)
      security: [{ staffCookie: [] }, { bearerAuth: [] }]
      responses:
        "200":
          description: Every post with its status.
          content:
            application/json:
              schema:
                type: object
                required: [posts]
                properties:
                  posts:
                    type: array
                    items: { $ref: "#/components/schemas/SitePost" }
        "404":
          description: Through the Relay.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      tags: [site]
      summary: Write a blog post (staff, office LAN only, #121)
      description: >
        Goes on the website at publish_at (default now) unless it is a draft.
        Once the site has been published, the Back Office republishes it by
        itself within a minute of a post coming due. Audited as site_post.create.
      security: [{ staffCookie: [] }, { bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SitePostRequest"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
        "400":
          description: Missing title or text, too long, or a bad date.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Through the Relay.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/site/posts/{postID}:
    put:
      tags: [site]
      summary: Edit a blog post (staff, office LAN only, #121)
      description: Audited as site_post.update.
      security: [{ staffCookie: [] }, { bearerAuth: [] }]
      parameters:
        - name: postID
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SitePostRequest"
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
        "400":
          description: Missing title or text, too long, or a bad date.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No such post, or through the Relay.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      tags: [site]
      summary: Delete a blog post (staff, office LAN only, #121)
      description: Practice content, not a record. The site drops it at the next publish. Audited as site_post.delete.
      security: [{ staffCookie: [] }, { bearerAuth: [] }]
      parameters:
        - name: postID
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Deleted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
        "404":
          description: No such post, or through the Relay.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/devices/current/push:
    put:
      tags: [devices]
      summary: Register this device's APNs token for push (#7)
      description: >
        Device-bound sessions only. The Back Office keeps the token on the
        device record and asks its Relay to push fixed, generic categories
        (new message, appointment reminder, visit starting). Cleared when
        the device is revoked or Apple reports it invalid.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, environment]
              properties:
                token: { type: string, description: Hex APNs device token. }
                environment: { type: string, enum: [sandbox, production] }
      responses:
        "204":
          description: Registered.
        "400":
          description: Malformed token or environment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Not a paired device.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      tags: [devices]
      summary: Stop push to this device
      responses:
        "204":
          description: Token cleared.
        "403":
          description: Not a paired device.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # -------------------------------------------------------------------------
  # Practice website, library and supply store (#97)
  # -------------------------------------------------------------------------
  /api/v1/site:
    get:
      tags: [site]
      summary: The website content and uploaded files (staff, office LAN only)
      description: Before anything is saved, starter content naming the practice.
      security: [{ bearerAuth: [] }, { staffCookie: [] }]
      responses:
        "200":
          description: Content and files.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SiteView" }
        "404":
          description: Through the Relay.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    put:
      tags: [site]
      summary: Save the website content (staff, office LAN only)
      security: [{ bearerAuth: [] }, { staffCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SiteContent" }
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema:
                type: object
                properties:
                  content: { $ref: "#/components/schemas/SiteContent" }
        "400":
          description: Too long, or a link that isn't https.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/site/files:
    post:
      tags: [site]
      summary: Upload a library download or an image (staff, office LAN only)
      description: >
        PDF, PNG, JPEG, WebP, ICO or plain text, at most 10 MB. The contents
        must match the extension. Library files are published at
        files/<filename> and listed in the app's library.
      security: [{ bearerAuth: [] }, { staffCookie: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [kind, file]
              properties:
                kind: { type: string, enum: [library, image] }
                title: { type: string, maxLength: 200 }
                file: { type: string, format: binary }
      responses:
        "201":
          description: Stored.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SiteFile" }
        "400":
          description: Wrong type, too large, or contents don't match.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: A file with that name exists.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/site/files/{fileID}:
    delete:
      tags: [site]
      summary: Delete an upload (staff, office LAN only)
      security: [{ bearerAuth: [] }, { staffCookie: [] }]
      parameters:
        - name: fileID
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Deleted. Publish again to take it off the site.
        "404":
          description: No such file.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/site/publish:
    post:
      tags: [site]
      summary: Render the site and publish it to the Relay (staff, office LAN only)
      description: >
        Renders the pages from the website content, uploads and active
        products (never a patient table) and streams them to the Relay over
        the office's SSH connection. The Relay serves them read-only at
        /s/<office-id>/. Audited as site.publish.
      security: [{ bearerAuth: [] }, { staffCookie: [] }]
      responses:
        "200":
          description: Published.
          content:
            application/json:
              schema:
                type: object
                required: [url, files, bytes]
                properties:
                  url: { type: string }
                  files: { type: integer }
                  bytes: { type: integer }
        "502":
          description: The Relay refused the site.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: Not connected to a Relay.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/library:
    get:
      tags: [site]
      summary: Podcast links and downloads for the app
      responses:
        "200":
          description: The library.
          content:
            application/json:
              schema:
                type: object
                required: [podcasts, files, site_url]
                properties:
                  podcasts: { $ref: "#/components/schemas/PodcastList" }
                  files:
                    type: array
                    items: { $ref: "#/components/schemas/SiteFile" }
                  site_url: { type: string, description: "The published site, or empty." }

  /api/v1/library/files/{fileID}:
    get:
      tags: [site]
      summary: Download one library file through the pinned connection
      parameters:
        - name: fileID
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The file.
          content:
            application/pdf:
              schema: { type: string, format: binary }
            image/png:
              schema: { type: string, format: binary }
            text/plain:
              schema: { type: string }
        "404":
          description: No such library file.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/store/products:
    get:
      tags: [store]
      summary: The supply catalogue
      description: Active products for patients; every product for staff on the office LAN.
      responses:
        "200":
          description: Products, by category.
          content:
            application/json:
              schema:
                type: object
                required: [products, payment]
                properties:
                  products:
                    type: array
                    items: { $ref: "#/components/schemas/Product" }
                  payment: { type: string, example: "Pay at pickup or by invoice." }
    post:
      tags: [store]
      summary: Add a product (staff, office LAN only)
      security: [{ bearerAuth: [] }, { staffCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProductRequest" }
      responses:
        "201":
          description: Added.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
        "409":
          description: SKU taken.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/store/products/{productID}:
    put:
      tags: [store]
      summary: Change a product (staff, office LAN only)
      description: Orders already placed keep the name and price they were placed with.
      security: [{ bearerAuth: [] }, { staffCookie: [] }]
      parameters:
        - name: productID
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProductRequest" }
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
        "404":
          description: No such product.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/store/products/demo:
    post:
      tags: [store]
      summary: Load the ten demo products (staff, office LAN only)
      security: [{ bearerAuth: [] }, { staffCookie: [] }]
      responses:
        "200":
          description: How many were added (existing SKUs are skipped).
          content:
            application/json:
              schema:
                type: object
                properties:
                  added: { type: integer }

  /api/v1/orders:
    post:
      tags: [store]
      summary: Place a supply order (patients, in the app)
      description: >
        1 to 20 active products, 1 to 20 of each, and at most 5 orders in
        progress. Payment is at pickup or by invoice. Audited as order.create.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  minItems: 1
                  maxItems: 20
                  items:
                    type: object
                    required: [product_id, quantity]
                    properties:
                      product_id: { type: string, format: uuid }
                      quantity: { type: integer, minimum: 1, maximum: 20 }
                note: { type: string, maxLength: 500 }
      responses:
        "201":
          description: Placed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "400":
          description: Bad quantities or a product that isn't available.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Not a patient.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: Too many orders in progress.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    get:
      tags: [store]
      summary: Orders, newest first
      description: >
        A patient's own orders; for staff on the office LAN, every order with
        the patient's name. Staff get 404 through the Relay.
      parameters:
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [placed, ready, fulfilled, cancelled] }
      responses:
        "200":
          description: Orders.
          content:
            application/json:
              schema:
                type: object
                required: [orders]
                properties:
                  orders:
                    type: array
                    items: { $ref: "#/components/schemas/Order" }

  /api/v1/orders/{orderID}/cancel:
    post:
      tags: [store]
      summary: Cancel your own order while it is still placed (patients)
      parameters:
        - name: orderID
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Cancelled.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "404":
          description: No such order of the caller's.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: Already ready, fulfilled or cancelled.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/orders/{orderID}/status:
    post:
      tags: [store]
      summary: Move an order on (staff, office LAN only)
      description: >
        placed → ready, fulfilled or cancelled; ready → fulfilled, cancelled
        or back to placed. Audited, and the patient's devices get the generic
        order_update push.
      security: [{ bearerAuth: [] }, { staffCookie: [] }]
      parameters:
        - name: orderID
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [placed, ready, fulfilled, cancelled] }
                note: { type: string, maxLength: 500, description: "Shown to the patient." }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "409":
          description: Not a move allowed from the current status.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  # Forms (#194): the practice's form library. Office LAN only (404 through
  # the Relay). Staff read; admins change. 403 while the practice's forms
  # switch is off (the default). Built-in instruments refuse changes (409).
  /api/v1/forms:
    get:
      tags: [forms]
      summary: The practice's forms, custom and built-in (staff, office LAN only, #194)
      security: [{ staffCookie: [] }, { bearerAuth: [] }]
      responses:
        "200":
          description: Every form with its latest version.
          content:
            application/json:
              schema:
                type: object
                required: [forms]
                properties:
                  forms:
                    type: array
                    items: { $ref: "#/components/schemas/FormSummary" }
        "403":
          description: Not staff, or forms are turned off.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Through the Relay.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    post:
      tags: [forms]
      summary: Create a custom form with its first draft (admins, office LAN only, #194)
      description: Without a definition the draft is a one-page starter. Audited as form.create.
      security: [{ staffCookie: [] }, { bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 200 }
                definition: { $ref: "#/components/schemas/FormDefinition" }
                template: { type: string, description: "A starter template key from GET /form-templates (#258), instead of a definition. The draft takes the form's name as its title." }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  form_id: { type: string, format: uuid }
                  version_id: { type: string, format: uuid }
                  version: { type: integer }
        "400":
          description: No name, or not JSON.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Not an admin, or forms are turned off.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Through the Relay.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: The definition is invalid.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FormDefinitionError" }

  /api/v1/forms/import:
    post:
      tags: [forms]
      summary: Import a definition file (admins, office LAN only, #194)
      description: >
        Without form_id the definition becomes a new custom form, named by its
        title, with that draft. With form_id it becomes that form's next
        draft (409 if the form already has a draft, is archived or is
        built-in). Audited as form.import.
      security: [{ staffCookie: [] }, { bearerAuth: [] }]
      parameters:
        - name: form_id
          in: query
          required: false
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FormDefinition" }
      responses:
        "201":
          description: Imported.
          content:
            application/json:
              schema:
                type: object
                properties:
                  form_id: { type: string, format: uuid }
                  version_id: { type: string, format: uuid }
                  version: { type: integer }
        "403":
          description: Not an admin, or forms are turned off.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: No such form, or through the Relay.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: The form already has a draft, is archived or is built-in.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: The definition is invalid.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FormDefinitionError" }

  /api/v1/forms/{formID}:
    get:
      tags: [forms]
      summary: A form and its versions (staff, office LAN only, #194)
      security: [{ staffCookie: [] }, { bearerAuth: [] }]
      parameters:
        - name: formID
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The form and every version, newest first, without definitions.
          content:
            application/json:
              schema:
                type: object
                required: [form, versions]
                properties:
                  form: { $ref: "#/components/schemas/FormSummary" }
                  versions:
                    type: array
                    items: { $ref: "#/components/schemas/FormVersionSummary" }
        "403":
          description: Not staff, or forms are turned off.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: No such form, or through the Relay.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/forms/{formID}/draft:
    post:
      tags: [forms]
      summary: Start a new draft from the latest version (admins, office LAN only, #194)
      description: The draft gets the next version number. Audited as form_version.draft.
      security: [{ staffCookie: [] }, { bearerAuth: [] }]
      parameters:
        - name: formID
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "201":
          description: The new draft.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  form_id: { type: string, format: uuid }
                  version: { type: integer }
        "403":
          description: Not an admin, or forms are turned off.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: No such form, or through the Relay.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: The form already has a draft, is archived or is built-in.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/forms/{formID}/archive:
    post:
      tags: [forms]
      summary: Archive a form (admins, office LAN only, #194)
      description: Its versions stay. Audited as form.archive.
      security: [{ staffCookie: [] }, { bearerAuth: [] }]
      parameters:
        - name: formID
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Archived.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  archived_at: { type: string, format: date-time }
        "403":
          description: Not an admin, or forms are turned off.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: No such form, or through the Relay.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: Already archived, or built-in.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/form-versions/{versionID}:
    get:
      tags: [forms]
      summary: One version with its definition (staff on the office LAN; patients, #194, #196)
      description: >
        Staff read any version of the practice on the LAN. A patient reads a
        version on one of their open occurrences, through the Relay; any other
        version is a 404.
      security: [{ staffCookie: [] }, { bearerAuth: [] }]
      parameters:
        - name: versionID
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The version; definition is in canonical form.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FormVersion" }
        "403":
          description: Not staff, or forms are turned off.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: No such version, or through the Relay.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    put:
      tags: [forms]
      summary: Save a draft's definition (admins, office LAN only, #194)
      description: >
        The body is the whole definition, validated by internal/forms.
        Published versions can't change (409; the database refuses it too).
        Audited as form_version.save.
      security: [{ staffCookie: [] }, { bearerAuth: [] }]
      parameters:
        - name: versionID
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FormDefinition" }
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  version: { type: integer }
                  digest: { type: string }
        "403":
          description: Not an admin, or forms are turned off.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: No such version, or through the Relay.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: Published, archived or built-in.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: The definition is invalid.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FormDefinitionError" }

  /api/v1/form-versions/{versionID}/publish:
    post:
      tags: [forms]
      summary: Publish a draft (admins, office LAN only, #194)
      description: Published versions are immutable. Audited as form_version.publish.
      security: [{ staffCookie: [] }, { bearerAuth: [] }]
      parameters:
        - name: versionID
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Published.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  version: { type: integer }
                  digest: { type: string }
                  published_at: { type: string, format: date-time }
        "403":
          description: Not an admin, or forms are turned off.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: No such version, or through the Relay.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: Already published, archived or built-in.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: The stored draft no longer validates, or names an image (#195) that isn't uploaded to the version.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FormDefinitionError" }

  /api/v1/form-versions/{versionID}/export:
    get:
      tags: [forms]
      summary: Download a version's definition (admins, office LAN only, #194)
      description: >
        Canonical JSON (sorted keys, compact, a final newline), so importing
        the file and exporting it again gives the same bytes.
      security: [{ staffCookie: [] }, { bearerAuth: [] }]
      parameters:
        - name: versionID
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The definition file, as an attachment.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FormDefinition" }
        "403":
          description: Not an admin, or forms are turned off.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: No such version, or through the Relay.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/form-versions/{versionID}/assets:
    post:
      tags: [forms]
      summary: Upload an image to a draft (admins, office LAN only, #195)
      description: >
        For display items ("media": {"type": "image", "asset": name}). PNG or
        JPEG only, checked by content and decoded header: at most 10 MB and 20
        megapixels each, 20 images and 64 MB per version. The name comes from
        the file name. Publishing needs every named image uploaded. A new
        draft gets copies. Audited as form_asset.upload.
      security: [{ staffCookie: [] }, { bearerAuth: [] }]
      parameters:
        - name: versionID
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        "201":
          description: Uploaded.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FormAsset" }
        "400":
          description: Not a PNG or JPEG, contents don't match, too large or too many pixels.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Not an admin, or forms are turned off.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: No such version, or through the Relay.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: Published, archived or built-in; the name is taken; or the version's budget is used up.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/form-versions/{versionID}/assets/{name}:
    get:
      tags: [forms]
      summary: An image of a form version (staff on the office LAN; patients for their open occurrences, #195, #196)
      security: [{ staffCookie: [] }, { bearerAuth: [] }]
      parameters:
        - name: versionID
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: name
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The image, served with nosniff and a sandboxing CSP.
          content:
            image/png:
              schema: { type: string, format: binary }
            image/jpeg:
              schema: { type: string, format: binary }
        "403":
          description: Not staff, or forms are turned off.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: No such image, or through the Relay.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      tags: [forms]
      summary: Remove an image from a draft (admins, office LAN only, #195)
      description: Audited as form_asset.delete.
      security: [{ staffCookie: [] }, { bearerAuth: [] }]
      parameters:
        - name: versionID
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: name
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Removed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  name: { type: string }
        "403":
          description: Not an admin, or forms are turned off.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: No such image or version, or through the Relay.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: Published, archived or built-in.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  # Form assignments (#196). Staff routes are office-LAN only; /me/forms is
  # the patient's, through the Relay. 403 code feature_off while forms are off.
  /api/v1/assignments:
    post:
      tags: [forms]
      summary: Assign a published form to a patient (staff, office LAN only, #196)
      description: >
        A provider assigns to their linked patients; the front desk and admins
        to any patient of the practice. The first occurrences (up to 14 days
        ahead) are created at once. Audited as form_assignment.create.
      security: [{ staffCookie: [] }, { bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [patient_id, form_id, schedule]
              properties:
                patient_id: { type: string, format: uuid }
                form_id: { type: string, format: uuid }
                version_id: { type: string, format: uuid, nullable: true, description: "A published version to pin; omit for the latest at each occurrence." }
                schedule: { $ref: "#/components/schemas/FormSchedule" }
                open_before_days: { type: integer, minimum: 0, maximum: 365, default: 0 }
                close_after_days: { type: integer, minimum: 0, maximum: 365, default: 3, description: "Not both 0." }
                channel: { type: string, enum: [app, kiosk], default: app }
      responses:
        "201":
          description: Assigned.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FormAssignment" }
        "400":
          description: A bad schedule, window, channel or version.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Not staff, not linked to the patient, or forms are turned off (code feature_off).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: No such patient or form, or through the Relay.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: The form is archived or has no published version.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    get:
      tags: [forms]
      summary: A patient's assignments and occurrences (staff, office LAN only, #196)
      description: Read-audited as form_assignments.list.
      security: [{ staffCookie: [] }, { bearerAuth: [] }]
      parameters:
        - name: patient_id
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Newest first, each with its occurrences (latest due first).
          content:
            application/json:
              schema:
                type: object
                required: [assignments]
                properties:
                  assignments:
                    type: array
                    items: { $ref: "#/components/schemas/FormAssignment" }
        "403":
          description: Not staff, not linked to the patient, or forms are turned off.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: No such patient, or through the Relay.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/assignments/{assignmentID}/end:
    post:
      tags: [forms]
      summary: End an assignment (staff, office LAN only, #196)
      description: >
        No new occurrences; those not yet open are cancelled; open ones stay
        open. Audited as form_assignment.end.
      security: [{ staffCookie: [] }, { bearerAuth: [] }]
      parameters:
        - name: assignmentID
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Ended.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FormAssignment" }
        "403":
          description: Not staff, not linked to the patient, or forms are turned off.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: No such assignment, or through the Relay.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: Already ended.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/form-occurrences/due:
    get:
      tags: [forms]
      summary: Forms due today, overdue and missed this week (staff, office LAN only, #196)
      description: >
        Overdue is due before today (practice time) and still open; missed is
        closed unfinished in the last 7 days. A provider sees their linked
        patients; the front desk and admins the practice. Read-audited as
        form_occurrences.due.
      security: [{ staffCookie: [] }, { bearerAuth: [] }]
      responses:
        "200":
          description: The three lists, each soonest due first, with the patient's linked providers.
          content:
            application/json:
              schema:
                type: object
                required: [due_today, overdue, missed_this_week, flagged_this_week]
                properties:
                  due_today: { type: array, items: { $ref: "#/components/schemas/DueOccurrence" } }
                  overdue: { type: array, items: { $ref: "#/components/schemas/DueOccurrence" } }
                  missed_this_week: { type: array, items: { $ref: "#/components/schemas/DueOccurrence" } }
                  flagged_this_week:
                    type: array
                    description: Submitted responses that raised a staff flag in the last 7 days (#199), newest first.
                    items:
                      type: object
                      properties:
                        response_id: { type: string, format: uuid }
                        patient_id: { type: string, format: uuid }
                        patient_name: { type: string }
                        form_name: { type: string }
                        submitted_at: { type: string, format: date-time }
                        flags: { type: array, items: { $ref: "#/components/schemas/FormFlag" } }
                        providers:
                          type: array
                          items:
                            type: object
                            properties:
                              id: { type: string, format: uuid }
                              name: { type: string }
        "403":
          description: Not staff, or forms are turned off.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Through the Relay.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/me/forms:
    get:
      tags: [forms]
      summary: The patient's open and upcoming forms (patient, #196)
      description: >
        Open occurrences, and upcoming ones up to 14 days ahead, of app
        assignments, soonest due first. Completed, missed and cancelled ones
        are not listed. See docs/MOBILE_CLIENT.md ("Forms").
      responses:
        "200":
          description: The list.
          content:
            application/json:
              schema:
                type: object
                required: [forms]
                properties:
                  forms:
                    type: array
                    items: { $ref: "#/components/schemas/MyForm" }
        "403":
          description: Not a patient, or forms are turned off (code feature_off).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  # Form responses (#197). The patient's routes come through the Relay with
  # the device session; staff reads are office-LAN only. Answers are PHI.
  /api/v1/responses:
    post:
      tags: [forms]
      summary: Start or resume a response to one of the patient's open forms (patient, #197)
      description: >
        Returns the in-progress response if there is one (200), otherwise
        starts one (201). The ETag header is the response's revision. Audited
        as form_response.start. See docs/MOBILE_CLIENT.md §16.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [occurrence_id]
              properties:
                occurrence_id: { type: string, format: uuid }
      responses:
        "200":
          description: The response in progress, with its saved pages (resume).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FormResponse" }
        "201":
          description: Started.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FormResponse" }
        "403":
          description: Not a patient, or forms are turned off (code feature_off).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Not one of the patient's forms.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: "code not_open, window_closed or already_submitted."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    get:
      tags: [forms]
      summary: A patient's submitted responses (staff, office LAN only, #197)
      description: Newest first, with scores and whether any staff member has opened each yet. Read-audited as form_responses.list.
      security: [{ staffCookie: [] }, { bearerAuth: [] }]
      parameters:
        - name: patient_id
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The list.
          content:
            application/json:
              schema:
                type: object
                required: [responses]
                properties:
                  responses:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, format: uuid }
                        form_name: { type: string }
                        version_id: { type: string, format: uuid }
                        version: { type: integer }
                        status: { type: string, enum: [submitted] }
                        submitted_at: { type: string, format: date-time }
                        new: { type: boolean, description: "No staff member has opened it yet." }
                        flags: { type: array, items: { $ref: "#/components/schemas/FormFlag" } }
                        scores:
                          type: object
                          additionalProperties: { $ref: "#/components/schemas/FormScore" }
        "403":
          description: Not staff, not linked to the patient, or forms are turned off.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: No such patient, or through the Relay.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/responses/{responseID}:
    get:
      tags: [forms]
      summary: A submitted response with answers, scores and flags (staff, office LAN only, #197)
      description: >
        Each answer comes with its item's text and a readable form. The
        first staff open is recorded (it clears the new badge); it isn't a
        clinical review. Read-audited as form_response.read.
      security: [{ staffCookie: [] }, { bearerAuth: [] }]
      parameters:
        - name: responseID
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  patient_id: { type: string, format: uuid }
                  occurrence_id: { type: string, format: uuid }
                  form_name: { type: string }
                  title: { type: string }
                  version_id: { type: string, format: uuid }
                  version: { type: integer }
                  status: { type: string, enum: [submitted] }
                  channel: { type: string, enum: [app, kiosk] }
                  started_at: { type: string, format: date-time }
                  submitted_at: { type: string, format: date-time }
                  first_read_at: { type: string, format: date-time, nullable: true }
                  new: { type: boolean }
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        item_id: { type: string }
                        page_id: { type: string }
                        type: { type: string }
                        text: { type: string }
                        answer: { description: "The answer as stored." }
                        display: { type: string, description: "Option texts, Yes or No, the number with its unit." }
                  scores:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        text: { type: string }
                        value: { type: string, nullable: true }
                        band: { type: string, nullable: true }
                        band_text: { type: string }
                        reason: { type: string }
                  flags: { type: array, items: { $ref: "#/components/schemas/FormFlag" } }
        "403":
          description: Not staff, not linked to the patient, or forms are turned off.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: No such submitted response, or through the Relay.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/responses/{responseID}/pages/{pageID}:
    put:
      tags: [forms]
      summary: Save one page's answers (patient, #197)
      description: >
        Replaces the page's previous save (append-only underneath). Needs the
        revision the app last saw (If-Match) and an Idempotency-Key; a retry
        with the same key and body returns the first result. Answers are
        checked for type, options and range; required answers are checked on
        submit. At most 64 KB. Audited as form_response.save_page (page id
        only).
      parameters:
        - name: responseID
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: pageID
          in: path
          required: true
          schema: { type: string }
        - name: If-Match
          in: header
          required: true
          schema: { type: string, example: '"3"' }
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [answers]
              properties:
                answers:
                  type: object
                  additionalProperties: true
                  description: "Item id to answer: a string, an array of strings, a boolean or a number. Null or absent is unanswered."
      responses:
        "200":
          description: Saved. ETag is the new revision.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  page_id: { type: string }
                  revision: { type: integer }
                  saved_at: { type: string, format: date-time }
        "400":
          description: "code if_match_required or idempotency_key_required, or a malformed body."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Not a patient, or forms are turned off (code feature_off).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: "Not the patient's response, or code unknown_page."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: "code stale_revision (with revision), idempotency_mismatch, window_closed or already_submitted."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "413":
          description: "code body_too_large: over 64 KB."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: "code invalid_answers, with errors [{item, code, message}]."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FormAnswerErrors" }

  /api/v1/responses/{responseID}/submit:
    post:
      tags: [forms]
      summary: Submit a response (patient, #197)
      description: >
        Rebuilds the answers from the latest save of each page, drops hidden
        items, checks required answers on visible pages, scores it on the
        server and completes the form. Submitting again returns the same
        result. Only scores the form shows to the patient are returned.
        Audited as form_response.submit (score ids and counts, never values).
      parameters:
        - name: responseID
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, format: uuid }
        - name: If-Match
          in: header
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Submitted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  status: { type: string, enum: [submitted] }
                  submitted_at: { type: string, format: date-time }
                  scores:
                    type: object
                    additionalProperties: { $ref: "#/components/schemas/FormScore" }
        "400":
          description: "code idempotency_key_required."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Not a patient, or forms are turned off (code feature_off).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Not the patient's response.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: "code window_closed or stale_revision."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: "code invalid_answers, with errors [{item, page_id, code, message}]; or code score_overflow."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FormAnswerErrors" }

  # Starting points (#258).
  /api/v1/forms/{formID}/copy:
    post:
      tags: [forms]
      summary: Copy a form or a built-in into a new custom form (admins, office LAN only, #258)
      description: >
        Duplicates a version of a custom form, or copies a built-in instrument
        into an editable custom form that keeps its copyright, with a note in
        the description that edits make it no longer the validated
        instrument. Built-ins can be copied only where they are available
        (#199). Images come too. Audited as form.create with copied_from.
      security: [{ staffCookie: [] }, { bearerAuth: [] }]
      parameters:
        - name: formID
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                version_id: { type: string, format: uuid, description: "Default: the latest published version, else the latest." }
                name: { type: string, maxLength: 200, description: "Default: the source's name with (copy)." }
      responses:
        "201":
          description: The new custom form and its draft.
          content:
            application/json:
              schema:
                type: object
                properties:
                  form_id: { type: string, format: uuid }
                  version_id: { type: string, format: uuid }
                  version: { type: integer }
                  name: { type: string }
        "403":
          description: Not an admin, or forms are turned off.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: No such form or version, or through the Relay.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: A built-in on a practice where built-ins aren't available.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/form-templates:
    get:
      tags: [forms]
      summary: Starter templates for New form (admins, office LAN only, #258)
      description: Synthetic, practice-neutral starting points bundled with the server.
      security: [{ staffCookie: [] }, { bearerAuth: [] }]
      responses:
        "200":
          description: The templates.
          content:
            application/json:
              schema:
                type: object
                properties:
                  templates:
                    type: array
                    items:
                      type: object
                      properties:
                        key: { type: string }
                        name: { type: string }
                        description: { type: string }
        "403":
          description: Not an admin, or forms are turned off.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Through the Relay.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
