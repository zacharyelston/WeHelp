name: WeHelp
options:
  bundleIdPrefix: com.zacelston.wehelp
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig

targets:
  WeHelp:
    type: application
    platform: iOS
    sources:
      - path: WeHelp
        excludes:
          - "Info.plist"
    info:
      path: WeHelp/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSHealthShareUsageDescription: "WeHelp shares your health data with your care team."
        NSHealthUpdateUsageDescription: "WeHelp records check-ins and readings to your health data."
        NSCameraUsageDescription: "WeHelp uses the camera to scan your practice's pairing code."
        NSFaceIDUsageDescription: "WeHelp uses Face ID to keep your health information private."
        NSBluetoothAlwaysUsageDescription: "WeHelp connects to your Bluetooth health monitors."
        # Demo setups run the Relay on the office LAN, which needs this prompt.
        NSLocalNetworkUsageDescription: "WeHelp connects to your practice's relay, which may be on your local network."
        # The app talks only to <office-id>.wehelp.invalid through the Relay,
        # pinning both the Relay and office keys (#36, spike S1). Default ATS
        # rejects the pinned self-signed office certificate even when the
        # delegate anchors it, so this one reserved domain gets a scoped
        # exception. TLS 1.3 is still required, and the pin still fails
        # closed. No NSAllowsLocalNetworking, no arbitrary loads.
        # MASVS checklist: #44.
        NSAppTransportSecurity:
          NSExceptionDomains:
            wehelp.invalid:
              NSIncludesSubdomains: true
              NSExceptionAllowsInsecureHTTPLoads: true
              NSExceptionMinimumTLSVersion: TLSv1.3
        # Debug-only demo connection (empty in Release).
        WeHelpDevTenant: $(WEHELP_DEV_TENANT)
        WeHelpDevEmail: $(WEHELP_DEV_EMAIL)
        WeHelpDevPassword: $(WEHELP_DEV_PASSWORD)
        WeHelpDevServers: $(WEHELP_DEV_SERVERS)
    entitlements:
      path: WeHelp/WeHelp.entitlements
      properties:
        com.apple.developer.healthkit: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zacelston.wehelp
        DEVELOPMENT_TEAM: WZYFJ8TSWD
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "6.0"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
