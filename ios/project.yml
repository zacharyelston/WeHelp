name: WeHelp
options:
  bundleIdPrefix: com.wehelp
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

targets:
  WeHelp:
    type: application
    platform: iOS
    sources:
      - path: WeHelp
        excludes:
          - "Info.plist"
    info:
      path: WeHelp/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSHealthShareUsageDescription: "WeHelp shares your health data with your care team."
        NSHealthUpdateUsageDescription: "WeHelp records check-ins and readings to your health data."
        NSBluetoothAlwaysUsageDescription: "WeHelp connects to your Bluetooth health monitors."
    entitlements:
      path: WeHelp/WeHelp.entitlements
      properties:
        com.apple.developer.healthkit: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wehelp.app
        SWIFT_VERSION: "6.0"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
